  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(newExecutionReviewForm());
  const [selectorDate, setSelectorDate] = useState("");
  const [formError, setFormError] = useState("");
  const [flash, setFlash] = useState("");
  const [filters, setFilters] = useState({compliance:"ALL",instrument:"ALL",deviation:"ALL",reason:"ALL",from:"",to:""});
  const [impactChartMode, setImpactChartMode] = useState("R");
  const [loadError, setLoadError] = useState("");
  const [saveError, setSaveError] = useState("");

  useEffect(function(){
    (async function(){
      try {
        const stored = await storage.get(EXECUTION_REVIEWS_KEY);
        const parsed = stored ? JSON.parse(stored.value) : [];
        if (!Array.isArray(parsed)) throw new Error("Formato non valido");
        setReviews(parsed);
      } catch(e) { setLoadError("Lettura delle review non riuscita. Nessun dato e stato sovrascritto."); }
      setLoaded(true);
    })();
  }, []);

  async function persistReviews(next, message) {
    setSaveError(""); setFlash("");
    try {
      await storage.set(EXECUTION_REVIEWS_KEY, JSON.stringify(next));
      setReviews(next);
      setFlash(message || "Saved");
      setTimeout(function(){ setFlash(""); }, 1800);
      return true;
    } catch(e) { setSaveError(e.message); setFormError(e.message); return false; }
  }
  function updateForm(key, value) {
    setForm(function(prev){
      const next = {};
      Object.keys(prev).forEach(function(k){ next[k] = prev[k]; });
      next[key] = value;
      if (key === "planCompliant" && value === "YES") {
        next.deviationType = "";
        next.tradeShouldNotExist = false;
        next.planCompliantExitPrice = "";
      }
      if (key === "planCompliant" && value === "NO") next.withoutInterventionExitPrice = "";
      if (key === "tradeShouldNotExist" && value) next.planCompliantExitPrice = "";
      return next;
    });
    setFormError("");
  }
  function openAdd() {
    setEditingId(null);
    setForm(newExecutionReviewForm());
    setSelectorDate("");
    setFormError("");
    setFormOpen(true);
  }
  function openEdit(review) {
    setEditingId(review.id);
    setSelectorDate("");
    setForm({
      linkedTradeId:review.linkedTradeId || "",
      exitPlan:review.exitPlan || "",
      exitMechanism:review.exitMechanism || "",
      planCompliant:review.planCompliant || "",
      deviationType:review.deviationType || "",
      reason:review.reason || "",
      decisionNote:review.decisionNote || "",
      tradeShouldNotExist:!!review.tradeShouldNotExist,
      planCompliantExitPrice:review.planCompliantExitPrice == null ? "" : String(review.planCompliantExitPrice),
      withoutInterventionExitPrice:review.withoutInterventionExitPrice == null ? "" : String(review.withoutInterventionExitPrice),
    });
    setFormError("");
    setFormOpen(true);
  }
  async function saveForm(openStopAfter) {
    const linkedTrade = (trades || []).find(function(trade){ return trade.id === form.linkedTradeId; });
    if (!linkedTrade) { setFormError("Select a valid trade."); return; }
    if (!form.exitPlan) { setFormError("Exit Plan is required."); return; }
    if (form.planCompliant !== "YES" && form.planCompliant !== "NO") { setFormError("Plan Compliant is required."); return; }
    if (form.planCompliant === "NO" && !form.deviationType) { setFormError("Deviation Type is required."); return; }
    if (form.planCompliant === "NO" && !form.reason) { setFormError("Reason is required."); return; }
    const planExit = parseOptionalPrice(form.planCompliantExitPrice);
    const forcedNoTrade = executionTradeShouldNotExist(form);
    if (form.planCompliant === "NO" && !forcedNoTrade && planExit == null) {
      setFormError("Plan-Compliant Exit is required unless the trade should not have existed.");
      return;
    }
    const withoutInterventionExit = parseOptionalPrice(form.withoutInterventionExitPrice);
    if (!editingId && reviews.some(function(review){ return review.linkedTradeId === linkedTrade.id; })) {
      setFormError("This trade already has an Execution Review. Edit the existing review.");
      return;
    }
    const previous = editingId ? reviews.find(function(review){ return review.id === editingId; }) : null;
    const now = new Date().toISOString();
    const record = {
      id:editingId || ("execution_review_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7)),
      linkedTradeId:linkedTrade.id,
      createdAt:previous && previous.createdAt ? previous.createdAt : now,
      updatedAt:now,
      exitPlan:form.exitPlan,
      exitMechanism:form.exitMechanism,
      planCompliant:form.planCompliant,
      deviationType:form.planCompliant === "NO" ? form.deviationType : "",
      reason:form.reason,
      decisionNote:String(form.decisionNote || "").trim(),
      tradeShouldNotExist:form.planCompliant === "NO" && forcedNoTrade,
      planCompliantExitPrice:form.planCompliant === "NO" && !forcedNoTrade ? planExit : null,
      withoutInterventionExitPrice:form.planCompliant === "YES" ? withoutInterventionExit : null,
    };
    const next = editingId
      ? reviews.map(function(review){ return review.id === editingId ? record : review; })
      : [record].concat(reviews);
    if (!await persistReviews(next, editingId ? "Review updated" : "Review added")) return;
    setFormOpen(false);
    setEditingId(null);
    if (openStopAfter && onOpenInitialStop) onOpenInitialStop(linkedTrade.id);
  }
  async function deleteReview(review) {
    if (!window.confirm("Delete this Execution Review? The original trade will not be deleted.")) return;
    await persistReviews(reviews.filter(function(item){ return item.id !== review.id; }), "Review deleted");
  }
  function setFilter(key, value) {
    setFilters(function(prev){
      const next = {};
      Object.keys(prev).forEach(function(k){ next[k] = prev[k]; });
      next[key] = value;
      return next;
    });
  }

  const tradeMap = {};
  (trades || []).forEach(function(trade){ if (trade && trade.id) tradeMap[trade.id] = trade; });
  const allSummary = calcExecutionReviewSummary(reviews, trades);
  const instrumentSet = {};
  allSummary.rows.forEach(function(row){ if (row.trade && row.trade.product) instrumentSet[row.trade.product] = true; });
  const instruments = Object.keys(instrumentSet).sort();
  let visibleRows = allSummary.rows.slice();
  visibleRows.sort(function(a,b){
    const ak = a.trade ? executionTradeSortKey(a.trade) : String(a.review.createdAt || "");
    const bk = b.trade ? executionTradeSortKey(b.trade) : String(b.review.createdAt || "");
    return bk.localeCompare(ak);
  });
  visibleRows = visibleRows.filter(function(row){
    if (filters.compliance !== "ALL" && row.review.planCompliant !== filters.compliance) return false;
    if (filters.instrument !== "ALL" && (!row.trade || row.trade.product !== filters.instrument)) return false;
    if (filters.deviation !== "ALL" && row.review.deviationType !== filters.deviation) return false;
    if (filters.reason !== "ALL" && row.review.reason !== filters.reason) return false;
    if (filters.from && (!row.trade || row.trade.date < filters.from)) return false;
    if (filters.to && (!row.trade || row.trade.date > filters.to)) return false;
    return true;
  });
  const summary = calcExecutionReviewSummary(visibleRows.map(function(row){ return row.review; }), trades);
  const impactGroups = calcExecutionImpactGroups(summary.rows);

  const reviewedTradeIds = {};
  reviews.forEach(function(review){ if (review.id !== editingId) reviewedTradeIds[review.linkedTradeId] = true; });
  const selectableTrades = (trades || []).filter(function(trade){
    return trade && trade.id && getTradeResult(trade) !== "Open" && !reviewedTradeIds[trade.id] && (!selectorDate || trade.date === selectorDate);
  }).sort(function(a,b){ return executionTradeSortKey(b).localeCompare(executionTradeSortKey(a)); });
  const selectedTrade = tradeMap[form.linkedTradeId] || null;
  const preview = deriveExecutionReview(form, selectedTrade);
  const inputStyle = {width:"100%",background:C.panel,border:"1px solid "+C.border,borderRadius:4,color:C.text,fontSize:12,padding:"10px 11px",fontFamily:"inherit",outline:"none",boxSizing:"border-box"};
  const labelStyle = {display:"block",fontSize:10,color:C.sub,letterSpacing:"0.11em",textTransform:"uppercase",fontWeight:700,marginBottom:7};
  const summaryCards = [
    {label:"Reviewed Trades",value:String(summary.reviewedTrades),color:C.text},
    {label:"Measured Decisions",value:String(summary.measuredDecisions),color:C.text},
    {label:"Deviation Days",value:String(summary.deviationDays),color:C.gold},
    {label:"Helpful Decisions",value:String(summary.helpfulDecisions),color:C.green},
    {label:"Harmful Decisions",value:String(summary.harmfulDecisions),color:C.red},
    {label:"Total R Gained",value:fmtR(summary.totalDecisionRGained),color:C.green},
    {label:"Total R Lost",value:summary.totalDecisionRLost.toFixed(2)+"R",color:C.red},
    {label:"Net Decision Impact",value:fmtR(summary.netDecisionImpact),color:summary.netDecisionImpact < 0 ? C.red : summary.netDecisionImpact > 0 ? C.green : C.sub},
  ];
  function ReviewMetric({label, value, color}) {
    return (
      <div style={{minWidth:120}}>
        <div style={{fontSize:9,color:C.sub,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:5}}>{label}</div>
        <div style={{fontSize:17,color:color || C.text,fontWeight:700}}>{value}</div>
      </div>
    );
  }

  if (loadError) return <div role="alert" style={{padding:20,color:C.red}}>{loadError}</div>;
  if (!loaded) return <div style={{padding:"50px 20px",textAlign:"center",color:C.sub}}>Loading Execution Reviews...</div>;
  return (
    <div>
      <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:18,flexWrap:"wrap",marginBottom:20,paddingBottom:18,borderBottom:"1px solid "+C.border}}>
        <div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:32,fontWeight:700,color:C.text,letterSpacing:"0.06em",textTransform:"uppercase",lineHeight:1}}>Execution Review</div>
          <div style={{fontSize:10,color:C.gold,letterSpacing:"0.13em",textTransform:"uppercase",marginTop:7}}>Plan Deviations & Decision Quality</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {flash && <span style={{fontSize:10,color:C.green,letterSpacing:"0.08em",textTransform:"uppercase"}}>{flash}</span>}
          <button onClick={openAdd} style={{background:C.gold,border:"1px solid "+C.gold,borderRadius:4,color:C.bg,fontSize:11,fontWeight:700,padding:"10px 16px",cursor:"pointer",fontFamily:"inherit",letterSpacing:"0.08em"}}>+ ADD EXECUTION REVIEW</button>
        </div>
      </div>

      {saveError && <div role="alert" style={{fontSize:11,color:C.red,lineHeight:1.5,marginBottom:12}}>{saveError}</div>}
      <div style={{fontSize:10,color:C.green,letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:700,margin:"2px 0 8px"}}>Decision Impact - All Measured Reviews</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(145px,1fr))",gap:8,marginBottom:16}}>
        {summaryCards.map(function(card){
          return (
            <div key={card.label} style={{background:C.card,border:"1px solid "+C.border,borderRadius:6,padding:"13px 14px",minHeight:74}}>
              <div style={{fontSize:9,color:C.sub,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:8,lineHeight:1.35}}>{card.label}</div>
              <div style={{fontSize:20,color:card.color,fontWeight:700}}>{card.value}</div>
            </div>
          );
        })}
      </div>

      <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:6,padding:"12px",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:9,marginBottom:16}}>
        <div>
          <span style={labelStyle}>Plan Compliant</span>
          <select value={filters.compliance} onChange={function(e){setFilter("compliance",e.target.value);}} style={inputStyle}>
            <option value="ALL">All</option><option value="YES">YES</option><option value="NO">NO</option>
          </select>
        </div>
        <div>
          <span style={labelStyle}>Instrument</span>
          <select value={filters.instrument} onChange={function(e){setFilter("instrument",e.target.value);}} style={inputStyle}>
            <option value="ALL">All</option>{instruments.map(function(item){return <option key={item} value={item}>{item}</option>;})}
          </select>
        </div>
        <div>
          <span style={labelStyle}>Deviation Type</span>
          <select value={filters.deviation} onChange={function(e){setFilter("deviation",e.target.value);}} style={inputStyle}>
            <option value="ALL">All</option>{DEVIATION_TYPE_OPTIONS.map(function(item){return <option key={item} value={item}>{item}</option>;})}
          </select>
        </div>
        <div>
          <span style={labelStyle}>Reason</span>
          <select value={filters.reason} onChange={function(e){setFilter("reason",e.target.value);}} style={inputStyle}>
            <option value="ALL">All</option>{EXECUTION_REASON_OPTIONS.map(function(item){return <option key={item} value={item}>{item}</option>;})}
          </select>
        </div>
        <div><span style={labelStyle}>From</span><input type="date" value={filters.from} onChange={function(e){setFilter("from",e.target.value);}} style={inputStyle}/></div>
        <div><span style={labelStyle}>To</span><input type="date" value={filters.to} onChange={function(e){setFilter("to",e.target.value);}} style={inputStyle}/></div>
      </div>

      <div className="execution-content-grid">
        <div style={{display:"grid",gap:10,minWidth:0}}>
          {!reviews.length && (
            <div style={{border:"1px dashed "+C.border,borderRadius:6,padding:"46px 20px",textAlign:"center",color:C.sub,fontSize:12}}>No Execution Reviews yet.</div>
          )}
          {!!reviews.length && !visibleRows.length && (
            <div style={{border:"1px dashed "+C.border,borderRadius:6,padding:"34px 20px",textAlign:"center",color:C.sub,fontSize:12}}>No reviews match these filters.</div>
          )}
        {visibleRows.map(function(row){
          const review = row.review; const trade = row.trade; const metrics = row.metrics;
          const isCompliant = review.planCompliant === "YES";
          const displayedImpact = isCompliant ? metrics.compliantDecisionValue : metrics.executionImpact;
          const impactColor = displayedImpact == null ? C.sub : displayedImpact < 0 ? C.red : displayedImpact > 0 ? C.green : C.sub;
          return (
            <div key={review.id} style={{background:C.card,border:"1px solid "+(review.planCompliant === "NO" ? C.red+"55" : C.border),borderRadius:7,padding:"16px 18px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:14,flexWrap:"wrap"}}>
                <div>
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,color:C.text,letterSpacing:"0.04em"}}>
                    {trade ? formatExecutionDate(trade.date)+" | "+(trade.product||"-")+" | "+(trade.entry_time||"-")+" > "+(trade.exit_time||"-") : "Linked trade unavailable"}
                  </div>
                  {trade && <div style={{fontSize:10,color:C.sub,marginTop:5}}>{(trade.direction||"-")+" | "+trade.entry_price+" > "+trade.exit_price+" | "+fmtD(Number(trade.pnl_dollars||0))}</div>}
                  <div style={{fontSize:10,color:C.gold,marginTop:7,letterSpacing:"0.05em"}}>{review.exitPlan+(review.exitMechanism?" | "+review.exitMechanism:"")}</div>
                  <div style={{fontSize:11,color:review.planCompliant === "NO" ? C.red : C.green,marginTop:5,fontWeight:700}}>
                    {(review.deviationType || "Plan-compliant decision")+(review.reason?" | "+review.reason:"")}
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{border:"1px solid "+(review.planCompliant === "NO" ? C.red : C.green),borderRadius:4,color:review.planCompliant === "NO" ? C.red : C.green,fontSize:10,fontWeight:700,padding:"5px 8px"}}>{"PLAN "+review.planCompliant}</span>
                  <button onClick={function(){openEdit(review);}} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:10,padding:"6px 9px",cursor:"pointer",fontFamily:"inherit"}}>EDIT</button>
                  <button onClick={function(){deleteReview(review);}} style={{background:"transparent",border:"1px solid "+C.red+"70",borderRadius:4,color:C.red,fontSize:10,padding:"6px 9px",cursor:"pointer",fontFamily:"inherit"}}>DELETE</button>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:14,borderTop:"1px solid "+C.border,marginTop:14,paddingTop:13}}>
                <ReviewMetric label="Actual R" value={fmtR(metrics.actualR)} color={metrics.actualR == null ? C.sub : metrics.actualR < 0 ? C.red : C.green}/>
                <ReviewMetric label={isCompliant ? "Without-Intervention R" : "Plan-Compliant R"} value={fmtR(isCompliant ? metrics.withoutInterventionR : metrics.planCompliantR)} color={(isCompliant ? metrics.withoutInterventionR : metrics.planCompliantR) == null ? C.sub : (isCompliant ? metrics.withoutInterventionR : metrics.planCompliantR) < 0 ? C.red : C.green}/>
                <ReviewMetric label={isCompliant ? "Decision Value" : "Execution Impact"} value={fmtR(displayedImpact)} color={impactColor}/>
                <ReviewMetric label="Initial SL" value={metrics.initialStop.price == null ? "Required" : String(metrics.initialStop.price)} color={metrics.initialStop.price == null ? C.gold : C.text}/>
              </div>
              {metrics.initialRiskPoints == null && trade && (
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap",background:C.gold+"10",borderTop:"1px solid "+C.gold+"45",margin:"13px -18px -2px",padding:"10px 18px"}}>
                  <span style={{fontSize:10,color:C.gold}}>Initial SL required to calculate R.</span>
                  <button onClick={function(){if(onOpenInitialStop)onOpenInitialStop(trade.id);}} style={{background:"transparent",border:"1px solid "+C.gold,borderRadius:4,color:C.gold,fontSize:10,padding:"6px 9px",cursor:"pointer",fontFamily:"inherit"}}>OPEN INITIAL SL</button>
                </div>
              )}
              {review.decisionNote && <div style={{borderTop:"1px solid "+C.border,marginTop:13,paddingTop:12,fontSize:11,color:C.text,lineHeight:1.65,whiteSpace:"pre-wrap"}}>{review.decisionNote}</div>}
            </div>
          );
        })}
        </div>
        <ExecutionImpactChart groups={impactGroups} mode={impactChartMode} onModeChange={setImpactChartMode}/>
      </div>

      {formOpen && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.90)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:C.card,border:"1px solid "+C.gold+"60",borderRadius:8,width:"min(920px,100%)",maxHeight:"92vh",overflowY:"auto",padding:"20px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:14,marginBottom:18,paddingBottom:14,borderBottom:"1px solid "+C.border}}>
              <div>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:700,color:C.text,letterSpacing:"0.06em",textTransform:"uppercase"}}>{editingId?"Edit Execution Review":"Add Execution Review"}</div>
                <div style={{fontSize:9,color:C.gold,letterSpacing:"0.12em",textTransform:"uppercase",marginTop:4}}>Single Trade Decision Review</div>
              </div>
              <button onClick={function(){setFormOpen(false);}} style={{background:"transparent",border:"none",color:C.sub,fontSize:22,cursor:"pointer",lineHeight:1}}>X</button>
            </div>

            {!editingId && (
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:10,marginBottom:14}}>
                <div><span style={labelStyle}>Filter Trade Date</span><input type="date" value={selectorDate} onChange={function(e){setSelectorDate(e.target.value);}} style={inputStyle}/></div>
                <div>
                  <span style={labelStyle}>Trade</span>
                  <select value={form.linkedTradeId} onChange={function(e){updateForm("linkedTradeId",e.target.value);}} style={inputStyle}>
                    <option value="">Select a trade...</option>
                    {selectableTrades.map(function(trade){return <option key={trade.id} value={trade.id}>{executionTradeLabel(trade)}</option>;})}
                  </select>
                </div>
              </div>
            )}
            {editingId && selectedTrade && <div style={{fontSize:12,color:C.text,borderBottom:"1px solid "+C.border,paddingBottom:13,marginBottom:14}}>{executionTradeLabel(selectedTrade)}</div>}
            {selectedTrade && (
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap",background:C.panel,border:"1px solid "+C.border,borderRadius:5,padding:"11px 12px",marginBottom:14}}>
                <span style={{fontSize:10,color:C.sub}}>{(selectedTrade.direction||"-")+" | P&L "+fmtD(Number(selectedTrade.pnl_dollars||0))+" | Initial SL "+(preview.initialStop.price == null?"required":preview.initialStop.price)}</span>
                {preview.initialStop.price == null && <span style={{fontSize:10,color:C.gold}}>R metrics unavailable until Initial SL is saved.</span>}
              </div>
            )}

            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(210px,1fr))",gap:12,marginBottom:14}}>
              <div>
                <span style={labelStyle}>Exit Plan</span>
                <select value={form.exitPlan} onChange={function(e){updateForm("exitPlan",e.target.value);}} style={inputStyle}>
                  <option value="">Select...</option>{EXIT_PLAN_OPTIONS.map(function(item){return <option key={item} value={item}>{item}</option>;})}
                </select>
              </div>
              <div>
                <span style={labelStyle}>Exit Mechanism</span>
                <select value={form.exitMechanism} onChange={function(e){updateForm("exitMechanism",e.target.value);}} style={inputStyle}>
                  <option value="">Select...</option>{EXIT_MECHANISM_OPTIONS.map(function(item){return <option key={item} value={item}>{item}</option>;})}
                </select>
              </div>
              <div>
                <span style={labelStyle}>Plan Compliant</span>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                  {["YES","NO"].map(function(value){
                    const selected = form.planCompliant === value; const col = value === "YES" ? C.green : C.red;
                    return <button key={value} onClick={function(){updateForm("planCompliant",value);}} style={{height:38,background:selected?col+"20":C.panel,border:"1px solid "+(selected?col:C.border),borderRadius:4,color:selected?col:C.sub,fontFamily:"inherit",fontSize:11,fontWeight:700,cursor:"pointer"}}>{value}</button>;
                  })}
                </div>
              </div>
              {form.planCompliant === "NO" && (
                <div>
                  <span style={labelStyle}>Deviation Type</span>
                  <select value={form.deviationType} onChange={function(e){updateForm("deviationType",e.target.value);}} style={inputStyle}>
                    <option value="">Select...</option>{DEVIATION_TYPE_OPTIONS.map(function(item){return <option key={item} value={item}>{item}</option>;})}
                  </select>
                </div>
              )}
              <div>
                <span style={labelStyle}>Reason {form.planCompliant === "NO" ? "*" : ""}</span>
                <select value={form.reason} onChange={function(e){updateForm("reason",e.target.value);}} style={inputStyle}>
                  <option value="">Select...</option>{EXECUTION_REASON_OPTIONS.map(function(item){return <option key={item} value={item}>{item}</option>;})}
                </select>
              </div>
              {form.planCompliant === "NO" && !executionTradeShouldNotExist(form) && (
                <div><span style={labelStyle}>Plan-Compliant Exit</span><input type="number" step="any" value={form.planCompliantExitPrice} onChange={function(e){updateForm("planCompliantExitPrice",e.target.value);}} style={inputStyle}/></div>
              )}
              {form.planCompliant === "YES" && (
                <div><span style={labelStyle}>Without-Intervention Exit Price</span><input type="number" step="any" value={form.withoutInterventionExitPrice} onChange={function(e){updateForm("withoutInterventionExitPrice",e.target.value);}} style={inputStyle}/></div>
              )}
            </div>

            {form.planCompliant === "NO" && (
              <label style={{display:"flex",alignItems:"center",gap:9,borderTop:"1px solid "+C.border,borderBottom:"1px solid "+C.border,padding:"11px 2px",marginBottom:14,cursor:executionTradeShouldNotExist({deviationType:form.deviationType})?"default":"pointer",fontSize:11,color:executionTradeShouldNotExist(form)?C.red:C.text}}>
                <input type="checkbox" checked={executionTradeShouldNotExist(form)} disabled={executionTradeShouldNotExist({deviationType:form.deviationType})} onChange={function(e){updateForm("tradeShouldNotExist",e.target.checked);}}/>
                This trade should not have existed (Plan-Compliant R = 0R)
              </label>
            )}

            <div style={{marginBottom:14}}>
              <span style={labelStyle}>Decision Note</span>

  function handleFile(e) {
    const file = e.target.files[0]; if (!file) return;
    setParsed(null); setError("");
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = parseTWCsv(ev.target.result);
        if (!data.length){ setError("Nessuna candela valida."); return; }
        const first = unixToETDate(data[0].time);
        const last  = unixToETDate(data[data.length - 1].time);
        const daySet = {};
        data.forEach(function(c){ daySet[unixToETDate(c.time)]=1; });
        const days = Object.keys(daySet).length;
        const timeframe = inferOhlcTimeframeSeconds(data);
        const gaps = countOhlcGaps(data, timeframe);
        setParsed({data:data,first:first,last:last,n:data.length,days:days,timeframe_seconds:timeframe,gaps:gaps}); setError("");
      } catch(err){ setError("Errore: "+err.message); }
    };
    reader.onerror = function(){ setError("Lettura del file non riuscita."); };
    reader.readAsText(file);
  }

// IMPORT MODAL (Tradovate)
function ImportModal({onClose, trades, setTrades, ohlcData, ohlcNQ}) {
  const [parsed,  setParsed]  = useState(null);
  const [error,   setError]   = useState("");
  const [saving,  setSaving]  = useState(false);
  function handleFile(e) {
    const file = e.target.files[0]; if (!file) return;
    setParsed(null); setError("");
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const res = parseTradovateCSV(ev.target.result);
        if (res.errors.length && !res.trades.length){ setError(res.errors.join(" | ")); setParsed(null); return; }
        setParsed(res); setError("");
      } catch(err) { setError("Errore: " + err.message); }
    };
    reader.onerror = function(){ setError("Lettura del file non riuscita."); };
    reader.readAsText(file);
  }
  async function handleImport(){
    if (!parsed || !parsed.trades.length) return;
    setSaving(true);
    setError("");
    try {
      const existingIds = {};
      trades.forEach(function(t){ existingIds[t.id]=1; });
      const newTrades = [...trades];
      parsed.trades.forEach(function(t){ if (!existingIds[t.id]) { newTrades.push(t); existingIds[t.id] = 1; } });
      const enriched = ((ohlcData && ohlcData.length) || (ohlcNQ && ohlcNQ.length)) ? enrichTradesWithMaeMfe(newTrades, ohlcData || [], ohlcNQ || []) : {trades:newTrades};
      await storage.set("jnl:v2:trades",JSON.stringify(enriched.trades));
      setTrades(enriched.trades);
      onClose();
    } catch(e) { setError(e.message); }
    finally { setSaving(false); }
  }
  const winsN   = parsed ? parsed.trades.filter(function(t){return getTradeResult(t)==="Win";}).length  : 0;
  const lossesN = parsed ? parsed.trades.filter(function(t){return getTradeResult(t)==="Loss";}).length : 0;

    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:12,padding:24,width:"100%",maxWidth:580}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18}}>
          <div>
            <div style={{fontSize:13,color:C.text,fontWeight:600,letterSpacing:"0.08em"}}>IMPORT - TRADOVATE</div>
            <div style={{fontSize:10,color:C.sub,marginTop:3}}>{"Position History CSV - Account -> Settings -> Orders -> Download CSV"}</div>
          </div>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:C.sub,fontSize:22,cursor:"pointer",lineHeight:1}}>{"X"}</button>
        </div>
        <div style={{border:"2px dashed "+C.border,borderRadius:8,padding:"24px 20px",textAlign:"center",marginBottom:14}}>
          {!parsed ? (
            <div>
              <div style={{fontSize:13,color:C.sub,marginBottom:4}}>Seleziona il file Position_History.csv</div>
              <div style={{fontSize:10,color:C.muted,marginBottom:18}}>Usa Position History, NON Orders</div>
              <label style={{display:"inline-block",padding:"9px 22px",border:"1px solid "+C.gold,borderRadius:4,color:C.gold,fontSize:12,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em"}}>
                SELEZIONA FILE CSV
                <input type="file" accept=".csv" onChange={handleFile} style={{display:"none"}}/>
              </label>
            </div>
          ) : (
            <div>
              <div style={{fontSize:14,color:C.green,fontWeight:700,marginBottom:8}}>{parsed.trades.length+" trade rilevati"}</div>
              <div style={{display:"flex",justifyContent:"center",gap:16,marginBottom:8}}>
                {winsN>0   && <span style={{fontSize:12,color:C.green,fontWeight:600}}>{"Win: "+winsN}</span>}
                {lossesN>0 && <span style={{fontSize:12,color:C.red,  fontWeight:600}}>{"Loss: "+lossesN}</span>}
                {besN>0    && <span style={{fontSize:12,color:C.sub,  fontWeight:600}}>{"BE: "+besN}</span>}
              </div>
              {parsed.errors.length>0 && <div style={{fontSize:10,color:C.gold,marginBottom:8}}>{parsed.errors.length+" righe ignorate"}</div>}
              <label style={{display:"inline-block",padding:"6px 16px",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:10,fontFamily:"inherit",cursor:"pointer",marginTop:4}}>
                Cambia file<input type="file" accept=".csv" onChange={handleFile} style={{display:"none"}}/>
              </label>
            </div>
          )}
        </div>
        {error && <div style={{marginBottom:12,padding:"8px 12px",background:C.red+"10",border:"1px solid "+C.red+"30",borderRadius:4,fontSize:11,color:C.red}}>{error}</div>}
        <div style={{padding:"10px 14px",background:C.gold+"08",border:"1px solid "+C.gold+"25",borderRadius:6,marginBottom:16}}>
          <div style={{fontSize:10,color:C.gold,fontWeight:600,marginBottom:3}}>Note</div>
          <div style={{fontSize:10,color:C.sub,lineHeight:1.6}}>Orari convertiti da IT a ET automaticamente. P/L lordo (senza commissioni). Trade duplicati ignorati.</div>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={handleImport} disabled={!parsed||saving||!parsed.trades.length}
            style={{padding:"9px 24px",background:"transparent",border:"1px solid "+(parsed&&parsed.trades.length?C.gold:C.muted),borderRadius:4,color:parsed&&parsed.trades.length?C.gold:C.muted,fontSize:11,fontFamily:"inherit",cursor:parsed&&parsed.trades.length?"pointer":"default",letterSpacing:"0.1em",textTransform:"uppercase"}}>

// EXPORT MODAL
function ExportModal({trades, rv, onClose}) {
  const headers = ["date","entry_time","exit_time","duration","direction","entry_price","exit_price","pnl_dollars","r","result","product","partial","notes"];
  const rows = [...trades].reverse().map(function(t){
    return headers.map(function(h){
      if (h==="r")       return '"'+calcR(t.pnl_dollars||0,rv).toFixed(2)+'"';
      if (h==="result")  return '"'+getTradeResult(t)+'"';
      if (h==="partial") return '"'+( t.partial?"Si":"No")+'"';
      return '"'+String(t[h] == null ? "" : t[h]).replace(/"/g,'""')+'"';
    }).join(",");
  });
  const csv = [headers.join(","), ...rows].join("\n");
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.90)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:12,padding:24,width:"100%",maxWidth:680}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <span style={{fontSize:13,color:C.text,fontWeight:600,letterSpacing:"0.08em"}}>EXPORT CSV</span>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:C.sub,fontSize:22,cursor:"pointer",lineHeight:1}}>{"X"}</button>
        </div>
        <textarea readOnly value={csv} rows={10} onFocus={function(e){e.target.select();}} style={{width:"100%",background:C.card,border:"1px solid "+C.border,borderRadius:6,color:C.sub,fontSize:10,padding:"12px",fontFamily:"'IBM Plex Mono',monospace",outline:"none",resize:"none",boxSizing:"border-box"}}/>
        <div style={{display:"flex",gap:10,marginTop:12}}>
          <button onClick={function(){navigator.clipboard.writeText(csv);}} style={{padding:"8px 20px",background:"transparent",border:"1px solid "+C.gold,borderRadius:4,color:C.gold,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase"}}>COPIA TUTTO</button>
          <button onClick={onClose} style={{fontSize:11,color:C.sub,background:"transparent",border:"none",cursor:"pointer",fontFamily:"inherit"}}>Chiudi</button>
        </div>
      </div>
    </div>
  );
}

// SETTINGS MODAL
function SettingsModal({rv, onSave, onClose}) {
  const [val, setVal] = useState(String(rv));
  const [saveError, setSaveError] = useState("");
  async function saveR(){
    setSaveError("");
    if (!validRValue(val)) { setSaveError("Il valore di 1R deve essere un numero maggiore di zero."); return; }
    try { await onSave(Number(val)); }
    catch(e) { setSaveError(e.message); }
  }
  const [backupStatus, setBackupStatus] = useState("");
  const [backupError, setBackupError] = useState("");
  const [restoreCandidate, setRestoreCandidate] = useState(null);
  const [restoreBusy, setRestoreBusy] = useState(false);
  function clearBackupFeedback(){ setBackupStatus(""); setBackupError(""); }
  function exportBackup(){
    clearBackupFeedback();
    try {
      const backup = createJournalBackup(localStorage);
      const blob = new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = journalBackupFilename();
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },1000);
      setBackupStatus("Backup exported successfully - "+backup.itemCount+" journal items exported.");
    } catch (error) {
      setBackupError(error && error.message ? error.message : "Unable to export Journal backup.");
    }
  }
  async function selectRestoreFile(event){
    const file = event.target.files && event.target.files[0];
    event.target.value = "";
    if (!file) return;
    clearBackupFeedback();
    try {
      const backup = parseJournalBackupText(await file.text());
      setRestoreCandidate({backup:backup,fileName:file.name});
    } catch (error) {
      setRestoreCandidate(null);
      setBackupError(error && error.message ? error.message : "Invalid or corrupted Journal backup.");
    }
  }
  function confirmRestore(){
    if (!restoreCandidate || restoreBusy) return;
    setRestoreBusy(true);
    clearBackupFeedback();
    try {
      const restored = restoreJournalBackup(localStorage, restoreCandidate.backup);
      setRestoreCandidate(null);
      setBackupStatus("Journal restored successfully - "+restored.itemCount+" items. Reloading...");
      setTimeout(function(){ window.location.reload(); },1000);
    } catch (error) {
      setRestoreCandidate(null);
      setRestoreBusy(false);
      setBackupError(error && error.message ? error.message : "Unable to restore Journal backup.");
    }
  }
  const actionButton = {padding:"10px 16px",background:"transparent",border:"1px solid "+C.gold,borderRadius:4,color:C.gold,fontSize:10,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase",textAlign:"center"};
  return (
    <>
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.90)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
            <span style={{fontSize:13,color:C.text,fontWeight:600,letterSpacing:"0.08em"}}>IMPOSTAZIONI</span>

          </div>
          <div style={{marginBottom:20}}>
            <div style={{fontSize:10,color:C.sub,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:10}}>{"1R = $ - valore fisso in dollari"}</div>
            <input type="number" value={val} onChange={function(e){setVal(e.target.value);}} min="1" step="25" style={{width:"100%",background:C.card,border:"1px solid "+C.border,borderRadius:4,color:C.text,fontSize:22,fontWeight:700,padding:"12px 16px",fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}/>
            <div style={{fontSize:10,color:C.sub,marginTop:8}}>{"Default $250 - Aggiorna ad ogni nuovo conto prop"}</div>
            <div style={{fontSize:10,color:C.sub,marginTop:4}}>{validRValue(val) ? "Esempio: +$500 -> "+(500/Number(val)).toFixed(2)+"R" : "Esempio: -"}</div>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={saveR} style={{padding:"10px 26px",background:"transparent",border:"1px solid "+C.gold,borderRadius:4,color:C.gold,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.12em",textTransform:"uppercase"}}>SALVA</button>
            <button onClick={onClose} style={{fontSize:11,color:C.sub,background:"transparent",border:"none",cursor:"pointer",fontFamily:"inherit"}}>Annulla</button>
          </div>
          {saveError && <div role="alert" style={{color:C.red,fontSize:11,lineHeight:1.5,marginTop:12}}>{saveError}</div>}
          <div style={{borderTop:"1px solid "+C.border,marginTop:24,paddingTop:20}}>
            <div style={{fontSize:11,color:C.text,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:8}}>Data & Backup</div>
            <div style={{fontSize:10,color:C.sub,lineHeight:1.6,marginBottom:14}}>Journal data is stored locally in this browser. Export a backup to protect or move your data.</div>

            {backupStatus && <div role="status" style={{fontSize:10,color:C.green,lineHeight:1.5,marginTop:12}}>{backupStatus}</div>}
            {backupError && <div role="alert" style={{fontSize:10,color:C.red,lineHeight:1.5,marginTop:12}}>{backupError}</div>}
          </div>
        </div>
      </div>
      {restoreCandidate && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.94)",zIndex:1100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} role="dialog" aria-modal="true" aria-label="Restore Journal Backup">

            <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:6,padding:"12px 14px",marginBottom:15}}>
              <div style={{fontSize:9,color:C.sub,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:6}}>Backup date</div>
              <div style={{fontSize:12,color:C.text,marginBottom:10}}>{new Date(restoreCandidate.backup.exportedAt).toLocaleString("it-IT")}</div>
              <div style={{display:"flex",gap:24,flexWrap:"wrap"}}>
                <div><span style={{fontSize:9,color:C.sub,textTransform:"uppercase"}}>Items </span><span style={{fontSize:12,color:C.text,fontWeight:700}}>{restoreCandidate.backup.itemCount}</span></div>
                <div style={{minWidth:0}}><span style={{fontSize:9,color:C.sub,textTransform:"uppercase"}}>File </span><span style={{fontSize:10,color:C.text,overflowWrap:"anywhere"}}>{restoreCandidate.fileName}</span></div>
              </div>
            </div>
            <div style={{fontSize:11,color:C.red,fontWeight:700,lineHeight:1.5,marginBottom:18}}>Current Journal data will be replaced.</div>
            <div style={{display:"flex",justifyContent:"flex-end",gap:10}}>
              <button onClick={function(){setRestoreCandidate(null);}} disabled={restoreBusy} style={{padding:"10px 16px",background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:10,fontFamily:"inherit",cursor:restoreBusy?"default":"pointer",letterSpacing:"0.1em"}}>CANCEL</button>
              <button onClick={confirmRestore} disabled={restoreBusy} style={{padding:"10px 18px",background:C.red,border:"1px solid "+C.red,borderRadius:4,color:C.text,fontSize:10,fontFamily:"inherit",cursor:restoreBusy?"default":"pointer",fontWeight:700,letterSpacing:"0.1em"}}>{restoreBusy?"RESTORING...":"RESTORE"}</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// MAIN APP
function Journal() {
  const [tab,          setTab]          = useState("dashboard");
  const [trades,       setTrades]       = useState([]);
  const [rv,           setRv]           = useState(R_DEFAULT);
  const [ohlcData,     setOhlcData]     = useState([]);
  const [ohlcMeta,     setOhlcMeta]     = useState(null);
  const [ohlcNQ,       setOhlcNQ]       = useState([]);
  const [ohlcMetaNQ,   setOhlcMetaNQ]   = useState(null);
  const [showOnlyR,    setShowOnlyR]    = useState(false);
  const [loading,      setLoading]      = useState(true);
  const [showImport,   setShowImport]   = useState(false);
  const [showExport,   setShowExport]   = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showTWImport, setShowTWImport] = useState(false);
  const [initialStopDate, setInitialStopDate] = useState(null);
  const [loadError, setLoadError] = useState("");
  const [loadWarning, setLoadWarning] = useState("");
  const [time,         setTime]         = useState("");
  function getTime(){
    const d=new Date();
    return DOW_IT[d.getDay()]+" "+d.toLocaleDateString("it-IT")+" "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  }
  useEffect(function(){
    setTime(getTime());
    const t=setInterval(function(){setTime(getTime());},30000);
    return function(){clearInterval(t);};
  },[]);
  useEffect(function(){
    (async function(){
      try{
        const tr=await storage.get("jnl:v2:trades");
        const st=await storage.get("jnl:v2:settings");
        const oh=await storage.get("jnl:v2:ohlc");
        const om=await storage.get("jnl:v2:ohlcmeta");
        const onq=await storage.get("jnl:v2:ohlcNQ");
        const omq=await storage.get("jnl:v2:ohlcMetaNQ");
        const loadedTrades = tr ? JSON.parse(tr.value) : [];
        if (!Array.isArray(loadedTrades) || loadedTrades.some(function(t){ return !t || typeof t !== "object" || Array.isArray(t); })) throw new Error("Formato trade non valido");
        const settings = st ? JSON.parse(st.value) : {};
        const es = oh ? JSON.parse(oh.value) : [];
        const nq = onq ? JSON.parse(onq.value) : [];
        const esMeta = om ? JSON.parse(om.value) : null;
        const nqMeta = omq ? JSON.parse(omq.value) : null;
        if (!Array.isArray(es) || !Array.isArray(nq)) throw new Error("Formato OHLC non valido");
        const cleanedTrades = clearMaeMfeBeforeStart(loadedTrades);
        setOhlcData(es.map(function(c){return{time:c[0],high:c[1],low:c[2]};}));
        setOhlcNQ(nq.map(function(c){return{time:c[0],high:c[1],low:c[2]};}));
        setOhlcMeta(esMeta); setOhlcMetaNQ(nqMeta);
        setTrades(cleanedTrades.trades);
        if (settings && settings.rv != null) {
          if (validRValue(settings.rv)) setRv(Number(settings.rv));
          else setLoadWarning("Valore R salvato non valido: uso temporaneo di $" + R_DEFAULT + ". Correggilo nelle Impostazioni.");
        }
        if (cleanedTrades.changed) {
          try { await storage.set("jnl:v2:trades",JSON.stringify(cleanedTrades.trades)); }
          catch(e) { setLoadWarning(e.message); }
        }
      }catch(e){ setLoadError("Lettura del journal non riuscita. Nessun dato e stato sovrascritto. Ricarica la pagina o usa Data & Backup nelle Impostazioni."); }
      setLoading(false);
    })();
  },[]);
  async function saveSettings(newR){
    if (!validRValue(newR)) throw new Error("Il valore di 1R deve essere maggiore di zero.");
    const stored = await storage.get("jnl:v2:settings");
    const settings = stored ? JSON.parse(stored.value) : {};
    await storage.set("jnl:v2:settings",JSON.stringify({...settings,rv:newR}));
    setRv(newR);
    setLoadWarning("");
    setShowSettings(false);
  }
  async function saveTWOhlc(data, meta){
    const product = detectOHLCProduct(data);
    meta.product = product;
    meta.timeframe_seconds = inferOhlcTimeframeSeconds(data);
    meta.gaps = countOhlcGaps(data, meta.timeframe_seconds);
    const compact = data.map(function(c){return[c.time,c.high,c.low];});
    const nextES = product === "NQ" ? ohlcData : data;
    const nextNQ = product === "NQ" ? data : ohlcNQ;
    const enriched = enrichTradesWithMaeMfe(trades, nextES, nextNQ);
    const entries = {};
    entries[product === "NQ" ? "jnl:v2:ohlcNQ" : "jnl:v2:ohlc"] = JSON.stringify(compact);
    entries[product === "NQ" ? "jnl:v2:ohlcMetaNQ" : "jnl:v2:ohlcmeta"] = JSON.stringify(meta);
    if (enriched.changed) entries["jnl:v2:trades"] = JSON.stringify(enriched.trades);
    writeJournalEntries(localStorage, entries);
    if (product === "NQ") {
      setOhlcNQ(data); setOhlcMetaNQ(meta);
    } else {
      setOhlcData(data); setOhlcMeta(meta);
    }
    if (enriched.changed) setTrades(enriched.trades);
  }
  async function updateInitialStop(tradeId, value){
    if (!tradeId) throw new Error("Trade non trovato.");
    let changed = false;
    const nextTrades = trades.map(function(t){
      if (t.id !== tradeId) return t;
      const next = withManualInitialStop(t, value);
      const fresh = calcMaeMfe(next, ohlcData, ohlcNQ);
      next.mae_mfe = fresh.available ? fresh : (t.mae_mfe && t.mae_mfe.available ? updateMaeMfeRiskFromTrade(next, t.mae_mfe) : fresh);
      changed = true;
      return next;
    });
    if (!changed) throw new Error("Trade non trovato.");
    await storage.set("jnl:v2:trades",JSON.stringify(nextTrades));
    setTrades(nextTrades);
  }
  function openInitialStops(){
    setInitialStopDate(initialStopEditorDate(trades));
    setTab("calendario");
  }
  function openInitialStopForTrade(tradeId){
    const trade = trades.find(function(item){ return item.id === tradeId; });
    if (!trade || !trade.date) return;
    setInitialStopDate(trade.date);
    setTab("calendario");
  }
  function toggleR(){ setShowOnlyR(function(v){return !v;}); }
  const TABS = [{k:"dashboard",l:"DASHBOARD"},{k:"calendario",l:"CALENDARIO"},{k:"settimanale",l:"SETTIMANALE"},{k:"playbook",l:"PLAYBOOK"},{k:"execution",l:"EXECUTION"},{k:"mindset",l:"CHAMPION MINDSET"}];
  if (loading) return (
    <div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.sub,fontFamily:"'IBM Plex Mono',monospace",fontSize:12}}>
      Caricamento...
    </div>
  );
  if (loadError) return (
    <div style={{padding:24,color:C.red,fontFamily:"monospace",lineHeight:1.6}}>
      <div role="alert">{loadError}</div>
      <button onClick={function(){setShowSettings(true);}} style={{marginTop:16,padding:10}}>IMPOSTAZIONI</button>
      {showSettings && <SettingsModal rv={rv} onSave={saveSettings} onClose={function(){setShowSettings(false);}}/>}
    </div>
  );
  return (
    <div style={{fontFamily:"'IBM Plex Mono','Courier New',monospace",fontSize:13,background:C.bg,minHeight:"100vh",color:C.text,padding:"20px 22px",boxSizing:"border-box"}}>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet"/>
      {loadWarning && <div role="alert" style={{color:C.gold,marginBottom:16,lineHeight:1.5}}>{loadWarning}</div>}
      {showImport    && <ImportModal   onClose={function(){setShowImport(false);}}   trades={trades} setTrades={setTrades} ohlcData={ohlcData} ohlcNQ={ohlcNQ}/>}
      {showExport    && <ExportModal   trades={trades} rv={rv}                        onClose={function(){setShowExport(false);}}/>}
      {showSettings  && <SettingsModal rv={rv}         onSave={saveSettings}          onClose={function(){setShowSettings(false);}}/>}
      {showTWImport  && <TWImportModal onClose={function(){setShowTWImport(false);}}  onSave={saveTWOhlc} existing={ohlcMeta}/>}
      <div className="journal-header">
        <div className="journal-identity">
          <div className="journal-name-row">
            <div className="journal-greeting">
              {"Hello "}<span style={{color:C.gold}}>Noemi</span>
            </div>
            <span className="journal-trade-count">{trades.length+" trade"}</span>
          </div>
        </div>
        <div className="journal-motto">{JOURNAL_MOTTO}</div>
        <div className="journal-settings">
          <span style={{fontSize:11,color:C.sub}}>{time}</span>
          <button onClick={function(){setShowSettings(true);}} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:10,padding:"5px 14px",cursor:"pointer",fontFamily:"inherit",letterSpacing:"0.1em",textTransform:"uppercase"}}>
            {"settings"}
          </button>
        </div>
      </div>
      <div style={{display:"flex",borderBottom:"1px solid "+C.border,marginBottom:22,gap:2,overflowX:"auto"}}>
        {TABS.map(function(t){
          return (
            <button key={t.k} onClick={function(){setTab(t.k);}} style={{flex:"0 0 auto",padding:"10px 26px",fontSize:13,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,letterSpacing:"0.14em",cursor:"pointer",background:"transparent",border:"none",borderBottom:"2px solid "+(tab===t.k?C.gold:C.border),color:tab===t.k?C.gold:C.sub,transition:"all 0.15s"}}>
              {t.l}
            </button>
          );
        })}
      </div>
      {tab==="dashboard"   && <Dashboard      trades={trades} rv={rv} ohlcData={ohlcData} ohlcNQ={ohlcNQ} showOnlyR={showOnlyR} onToggleR={toggleR} onOpenInitialStops={openInitialStops}/>}
      {tab==="calendario"  && <CalendarioView  trades={trades} rv={rv} onImport={function(){setShowImport(true);}} onExport={function(){setShowExport(true);}} onTWImport={function(){setShowTWImport(true);}} ohlcMeta={ohlcMeta} showOnlyR={showOnlyR} onToggleR={toggleR} onUpdateInitialStop={updateInitialStop} initialStopDate={initialStopDate}/>}
      {tab==="settimanale" && <SettimanaleView/>}
      {tab==="playbook"    && <WeeklyPlaybookView/>}
      {tab==="execution"   && <ExecutionReviewView trades={trades} onOpenInitialStop={openInitialStopForTrade}/>}
      {tab==="mindset"     && <ChampionMindsetView/>}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(Journal));
  </script>
</body>
</html>
