function getFascia(t) {
  if (!t) return "Altro";
  const parts = t.split(":"); const h = Number(parts[0]); const m = Number(parts[1]);
  const mins = h * 60 + m;
  if (mins >= 570 && mins <= 600) return "Gold Zone";      // 9:30-10:00
  if (mins >= 601 && mins <= 630) return "Silver Zone";    // 10:01-10:30
  if (mins >= 631 && mins <= 660) return "Dead Zone";      // 10:31-11:00
  if (mins >= 661 && mins <= 720) return "Mid AM";         // 11:01-12:00
  if (mins >= 721 && mins <= 779) return "Lunch";          // 12:01-12:59
  if (mins >= 780 && mins <= 840) return "PM Post Lunch";  // 13:00-14:00
  if (mins >= 841 && mins <= 899) return "PM Session";     // 14:01-14:59
  if (mins >= 900)                return "Power Hour";     // 15:00+
  return "Altro";
}
function getSession(t) {

  const mins = h * 60 + m;
  if (mins < 570) return "Pre Market";
  if (mins < 720) return "AM";

function getCalendarWeeks(year, month) {
  const first = new Date(year, month, 1);
  const last  = new Date(year, month + 1, 0);
  const dow   = first.getDay();
  const back  = dow === 0 ? 6 : dow - 1;
  const start = new Date(first);
  start.setDate(start.getDate() - back);
  const weeks = [];
  const cur = new Date(start);
  while (weeks.length < 7) {
    const week = [];
    for (let d = 0; d < 5; d++) {
      const dt = new Date(cur);
      dt.setDate(dt.getDate() + d);
      const ds = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
      week.push({ day: dt.getDate(), dateStr: ds, inMonth: dt.getMonth() === month && dt.getFullYear() === year });
    }
    weeks.push(week);
    cur.setDate(cur.getDate() + 7);
    if (cur > last && weeks.length >= 1) break;
  }
  return weeks.filter(function(w) { return w.some(function(d) { return d.inMonth; }); });
}

// TRADOVATE PARSER
function parseCSVLine(line) {
  const result = [];
  let current = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === "," && !inQuotes) { result.push(current.trim()); current = ""; }
    else { current += ch; }
  }
  result.push(current.trim());
  return result;
}
function getNthSunday(year, month, n) {
  const d = new Date(year, month, 1);
  const daysToFirstSun = d.getDay() === 0 ? 0 : 7 - d.getDay();
  return new Date(year, month, 1 + daysToFirstSun + (n - 1) * 7);
}
function getLastSunday(year, month) {
  const lastDay = new Date(year, month + 1, 0);
  return new Date(year, month, lastDay.getDate() - lastDay.getDay());
}
function getETOffset(dateStr) {
  const p = dateStr.split("/");
  const date = new Date(parseInt(p[2]), parseInt(p[0]) - 1, parseInt(p[1]));
  const y = date.getFullYear();
  const usStart = getNthSunday(y, 2, 2);
  const usEnd   = getNthSunday(y, 10, 1);
  const euStart = getLastSunday(y, 2);
  const euEnd   = getLastSunday(y, 9);
  const usDst = date >= usStart && date < usEnd;
  const euDst = date >= euStart && date < euEnd;
  if (usDst && euDst)    return 6;
  if (!usDst && !euDst)  return 6;
  if (usDst && !euDst)   return 5;
  return 7;
}
function itToET(dateStr, timeStr) {
  const offset = getETOffset(dateStr);
  const p = dateStr.split("/");
  const t = timeStr.split(":");
  const dt = new Date(parseInt(p[2]), parseInt(p[0]) - 1, parseInt(p[1]), parseInt(t[0]), parseInt(t[1]), parseInt(t[2] || 0));
  dt.setHours(dt.getHours() - offset);
  return {
    date: dt.toISOString().slice(0, 10),
    time: String(dt.getHours()).padStart(2, "0") + ":" + String(dt.getMinutes()).padStart(2, "0"),
  };
}
function parseTradeTimestamp(ts) {
  const parts = String(ts || "").split(" ");
  if (parts.length < 2) return null;
  const d = parts[0].split("/");
  const t = parts[1].split(":");
  if (d.length < 3 || t.length < 2) return null;
  return new Date(parseInt(d[2]), parseInt(d[0]) - 1, parseInt(d[1]), parseInt(t[0]), parseInt(t[1]), parseInt(t[2] || 0));
}
function parseMoney(v) {
  const n = parseFloat(String(v || "0").replace(/,/g, ""));
  return isNaN(n) ? 0 : n;
}
function stableIdPart(v) {
  return String(v || "").replace(/[^A-Za-z0-9_-]/g, "");
}
function weightedAvg(events) {
  let qty = 0; let sum = 0;
  for (let i = 0; i < events.length; i++) {
    qty += events[i].qty;
    sum += events[i].qty * events[i].price;
  }
  return qty ? sum / qty : null;
}
function eventKey(lot, type) {
  const fillId = type === "entry" ? lot.entryFillId : lot.exitFillId;
  const ts = type === "entry" ? lot.entryTs : lot.exitTs;
  const price = type === "entry" ? lot.entryPrice : lot.exitPrice;
  if (fillId) return type + "_fill_" + fillId;
  return type + "_fallback_" + ts + "_" + price + "_" + lot.pairId + "_" + lot.rowIndex;
}
function pushEvent(map, lot, type) {
  const key = eventKey(lot, type);
  if (!map[key]) {
    const isEntry = type === "entry";
    map[key] = {
      key: key,
      type: type,
      fillId: isEntry ? lot.entryFillId : lot.exitFillId,
      ts: isEntry ? lot.entryTs : lot.exitTs,
      rawTimestamp: isEntry ? lot.entryRawTs : lot.exitRawTs,
      price: isEntry ? lot.entryPrice : lot.exitPrice,
      qty: 0,
      rowIndexes: {},
      firstRow: lot.rowIndex,
    };
  }
  map[key].qty += lot.qty;
  map[key].rowIndexes[lot.rowIndex] = true;
  if (lot.rowIndex < map[key].firstRow) map[key].firstRow = lot.rowIndex;
}
function buildTradeFromCycle(lotsByIndex, cycle) {
  const rows = [];
  const rowKeys = Object.keys(cycle.rowIndexes);
  for (let i = 0; i < rowKeys.length; i++) rows.push(lotsByIndex[rowKeys[i]]);
  rows.sort(function(a,b){ return a.rowIndex - b.rowIndex; });
  const entryEvents = cycle.events.filter(function(e){ return e.type === "entry"; });
  const exitEvents  = cycle.events.filter(function(e){ return e.type === "exit"; });
  entryEvents.sort(function(a,b){ return a.ts - b.ts || a.firstRow - b.firstRow; });
  exitEvents.sort(function(a,b){ return a.ts - b.ts || a.firstRow - b.firstRow; });
  const firstEntry = entryEvents[0];
  const lastExit = exitEvents.length ? exitEvents[exitEvents.length - 1] : entryEvents[entryEvents.length - 1];
  const entryParts = firstEntry.rawTimestamp.split(" ");
  const exitParts = lastExit.rawTimestamp.split(" ");
  const entryET = itToET(entryParts[0], entryParts[1] || "00:00:00");
  const exitET = itToET(exitParts[0], exitParts[1] || "00:00:00");
  const pnl = rows.reduce(function(s,r){ return s + r.pnl; }, 0);
  const entryIds = entryEvents.map(function(e){ return stableIdPart(e.fillId || e.key); }).join("-");
  const exitIds = exitEvents.map(function(e){ return stableIdPart(e.fillId || e.key); }).join("-");
  const first = rows[0] || {};
  const result = getTradeResult({ pnl_dollars: pnl });
  const sourceIds = rows.map(function(r){ return r.legacyId; });
  return {
    id: "tv_real_" + stableIdPart(first.account) + "_" + stableIdPart(first.contract) + "_" + first.direction + "_" + entryIds + "_" + exitIds,
    date: entryET.date,
    entry_time: entryET.time,
    exit_time: exitET.time,
    duration: Math.max(0, Math.round((lastExit.ts - firstEntry.ts) / 60000)),
    direction: first.direction,
    side: first.direction === "Buy" ? "Long" : "Short",
    entry_price: weightedAvg(entryEvents),
    exit_price: weightedAvg(exitEvents),
    pnl_dollars: Math.round(pnl * 100) / 100,
    result: result,
    product: first.product || "ES",
    contract: first.contract || "",
    account: first.account || "",
    quantity: cycle.maxNet,
    max_position_size: cycle.maxNet,
    entry_leg_count: entryEvents.length,
    exit_leg_count: exitEvents.length,
    partial: exitEvents.length > 1,
    source_row_count: rows.length,
    source_row_ids: sourceIds,
    notes: "",
  };
}
function aggregateTradovateLots(lots) {
  const byLane = {};
  for (let i = 0; i < lots.length; i++) {
    const lot = lots[i];
    const lane = [lot.account, lot.contract, lot.product, lot.direction].join("|");
    if (!byLane[lane]) byLane[lane] = [];
    byLane[lane].push(lot);
  }
  const trades = [];
  const lanes = Object.keys(byLane);
  for (let li = 0; li < lanes.length; li++) {
    const laneLots = byLane[lanes[li]];
    const eventMap = {};
    const lotsByIndex = {};
    for (let i = 0; i < laneLots.length; i++) {
      lotsByIndex[laneLots[i].rowIndex] = laneLots[i];
      pushEvent(eventMap, laneLots[i], "entry");
      pushEvent(eventMap, laneLots[i], "exit");
    }
    const events = Object.keys(eventMap).map(function(k){ return eventMap[k]; });
    events.sort(function(a,b){
      if (a.ts !== b.ts) return a.ts - b.ts;
      if (a.type !== b.type) return a.type === "entry" ? -1 : 1;
      return a.firstRow - b.firstRow;
    });
    let cycle = null; let net = 0;
    for (let ei = 0; ei < events.length; ei++) {
      const ev = events[ei];
      if (!cycle) cycle = { events: [], rowIndexes: {}, maxNet: 0 };
      cycle.events.push(ev);
      const rowKeys = Object.keys(ev.rowIndexes);
      for (let ri = 0; ri < rowKeys.length; ri++) cycle.rowIndexes[rowKeys[ri]] = true;
      if (ev.type === "entry") {
        net += ev.qty;
        if (net > cycle.maxNet) cycle.maxNet = net;
      } else {
        net -= ev.qty;
        if (net <= 0.000001) {
          trades.push(buildTradeFromCycle(lotsByIndex, cycle));
          cycle = null;
          net = 0;
        }
      }
    }
    if (cycle) trades.push(buildTradeFromCycle(lotsByIndex, cycle));
  }
  trades.sort(function(a,b){
    const ad = new Date(a.date + "T" + a.entry_time + ":00").getTime();
    const bd = new Date(b.date + "T" + b.entry_time + ":00").getTime();
    return bd - ad;
  });
  return trades;
}
function parseTradovateCSV(text) {
  const content = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  const lines = content.trim().split("\n").filter(function(l) { return l.trim(); });
  if (lines.length < 2) return { trades: [], errors: ["File vuoto."] };
  const header = parseCSVLine(lines[0]);
  if (header.indexOf("Bought Timestamp") === -1) {
    return { trades: [], errors: ["Formato non riconosciuto. Usa Position History, NON Orders."] };
  }
  const lots = [];
  const errors = [];
  const seenRows = {};
  for (let i = 1; i < lines.length; i++) {
    try {
      const row = parseCSVLine(lines[i]);
      const obj = {};
      for (let j = 0; j < header.length; j++) { obj[header[j]] = row[j] || ""; }
      const boughtTs = obj["Bought Timestamp"];
      const soldTs   = obj["Sold Timestamp"];
      if (!boughtTs || !soldTs) continue;
      const pairId = obj["Pair ID"] || "";
      const dedupeKey = pairId ? ("pair:" + pairId) : ("row:" + lines[i]);
      if (seenRows[dedupeKey]) continue;
      seenRows[dedupeKey] = true;
      const bParts = boughtTs.split(" "); const bDate = bParts[0]; const bTime = bParts[1];
      const sParts = soldTs.split(" ");   const sDate = sParts[0]; const sTime = sParts[1];
      const bDt = parseTradeTimestamp(boughtTs);
      const sDt = parseTradeTimestamp(soldTs);
      if (!bDt || !sDt) continue;
      const isBuy = bDt.getTime() <= sDt.getTime();
      const qty = parseMoney(obj["Paired Qty"]);
      if (qty <= 0) continue;
      const buyPrice  = parseMoney(obj["Buy Price"]);
      const sellPrice = parseMoney(obj["Sell Price"]);
      const pnl = parseMoney(obj["P/L"]);
      const posId  = obj["Position ID"] || "";
      const legacyId = (posId && pairId) ? (posId + "_" + pairId) : ("tv_" + i);
      lots.push({
        rowIndex: i,
        legacyId: legacyId,
        positionId: posId,
        pairId: pairId,
        buyFillId: obj["Buy Fill ID"] || "",
        sellFillId: obj["Sell Fill ID"] || "",
        account: obj["Account"] || "",
        contract: obj["Contract"] || "",
        product: obj["Product"] || "ES",
        qty: qty,
        pnl: pnl,
        direction: isBuy ? "Buy" : "Sell",
        entryFillId: isBuy ? (obj["Buy Fill ID"] || "") : (obj["Sell Fill ID"] || ""),
        exitFillId: isBuy ? (obj["Sell Fill ID"] || "") : (obj["Buy Fill ID"] || ""),
        entryTs: isBuy ? bDt.getTime() : sDt.getTime(),
        exitTs: isBuy ? sDt.getTime() : bDt.getTime(),
        entryRawTs: isBuy ? boughtTs : soldTs,
        exitRawTs: isBuy ? soldTs : boughtTs,
        entryPrice: isBuy ? buyPrice : sellPrice,
        exitPrice: isBuy ? sellPrice : buyPrice,
      });
    } catch(e) { errors.push("Riga " + (i + 1) + ": " + e.message); }
  }
  const trades = aggregateTradovateLots(lots);
  const rawPnl = lots.reduce(function(s,l){ return s + l.pnl; }, 0);
  const aggPnl = trades.reduce(function(s,t){ return s + (t.pnl_dollars || 0); }, 0);
  if (Math.abs(rawPnl - aggPnl) > 0.01) {
    errors.push("Warning P/L: raw " + rawPnl.toFixed(2) + " diverso da aggregato " + aggPnl.toFixed(2));
  }
  return { trades: trades, errors: errors };
}


// DETECT OHLC PRODUCT
function detectOHLCProduct(data) {
  if (!data || !data.length) return "ES";
  const mid = (data[0].high + data[0].low) / 2;
  return mid > 15000 ? "NQ" : "ES";
}

// MAE / MFE
function parseTWCsv(text) {
  const lines = text.trim().split("\n").filter(function(l) { return l.trim(); });
  if (lines.length < 2) return [];
  const result = [];
  for (let i = 1; i < lines.length; i++) {
    const p = lines[i].split(",");
    if (p.length < 4) continue;
    const time = parseInt(p[0]); const high = parseFloat(p[2]); const low = parseFloat(p[3]);
    if (!isNaN(time) && !isNaN(high) && !isNaN(low)) result.push({ time: time, high: high, low: low });
  }
  return result;
}
function unixToETDate(ts) {
  const etMs = ts * 1000 - 4 * 3600 * 1000;
  return new Date(etMs).toISOString().slice(0, 10);
}
function etToUnix(dateStr, timeStr) {
  const dp = dateStr.split("-"); const tp = timeStr.split(":");
  return Math.floor(new Date(Date.UTC(parseInt(dp[0]), parseInt(dp[1]) - 1, parseInt(dp[2]), parseInt(tp[0]) + 4, parseInt(tp[1]), 0)).getTime() / 1000);
}
function calcMaeMfe(trade, ohlcES, ohlcNQ) {
  const product = (trade.product || "ES").toUpperCase();
  const ohlcData = (product === "NQ" || product === "MNQ") ? (ohlcNQ || []) : (ohlcES || []);
  if (!trade.entry_price || !trade.exit_price || !trade.entry_time || !trade.exit_time || !ohlcData.length) return null;
  const entryUnix = etToUnix(trade.date, trade.entry_time);
  const exitUnix  = etToUnix(trade.date, trade.exit_time);
  const candles = ohlcData.filter(function(c) { return c.time >= entryUnix - 300 && c.time <= exitUnix; });
  if (!candles.length) return null;
  let maxHigh = -Infinity; let minLow = Infinity;
  for (let i = 0; i < candles.length; i++) {
    if (candles[i].high > maxHigh) maxHigh = candles[i].high;
    if (candles[i].low  < minLow)  minLow  = candles[i].low;
  }
  const ep = parseFloat(trade.entry_price); const xp = parseFloat(trade.exit_price);
  let mae; let mfe; let pnlPts;
  if (trade.direction === "Buy") { mae = Math.max(0, ep - minLow); mfe = Math.max(0, maxHigh - ep); pnlPts = xp - ep; }
  else                           { mae = Math.max(0, maxHigh - ep); mfe = Math.max(0, ep - minLow); pnlPts = ep - xp; }
  const efficiency = mfe > 0.01 ? Math.max(0, Math.min(100, (pnlPts / mfe) * 100)) : 0;
  return { mae: mae, mfe: mfe, efficiency: efficiency };
}
function calcMaeMfeStats(trades, ohlcES, ohlcNQ) {
  if ((!ohlcES || !ohlcES.length) && (!ohlcNQ || !ohlcNQ.length)) return null;
  const results = [];
  for (let i = 0; i < trades.length; i++) {
    const t = trades[i];
    if (getTradeResult(t) !== "Open" && t.entry_price && t.exit_price) {
      const r = calcMaeMfe(t, ohlcES, ohlcNQ);
      if (r) results.push(r);
    }
  }
  if (!results.length) return null;
  const n = results.length;
  let sumMae = 0; let sumMfe = 0; let sumEff = 0; let cntEff = 0;
  for (let i = 0; i < results.length; i++) {
    sumMae += results[i].mae;
    sumMfe += results[i].mfe;
    if (results[i].mfe > 0.01) { sumEff += results[i].efficiency; cntEff++; }
  }
  return { avgMae: sumMae / n, avgMfe: sumMfe / n, avgEff: cntEff ? sumEff / cntEff : 0, n: n };
}

// STATS ENGINE
function calcStats(trades, rv) {
  const closed = trades.filter(function(t) { return getTradeResult(t) !== "Open"; });
  if (!closed.length) return null;
  const wins   = closed.filter(function(t) { return getTradeResult(t) === "Win"; });
  const losses = closed.filter(function(t) { return getTradeResult(t) === "Loss"; });
  const bes    = closed.filter(function(t) { return getTradeResult(t) === "BE"; });
  const wlN = wins.length + losses.length;
  const wr = wlN ? wins.length / wlN : 0;
  const wR = wins.map(function(t)   { return calcR(t.pnl_dollars, rv); });
  const lR = losses.map(function(t) { return calcR(t.pnl_dollars, rv); });
  const avgW = wR.length ? wR.reduce(function(a,b){return a+b;},0) / wR.length : 0;
  const avgL = lR.length ? lR.reduce(function(a,b){return a+b;},0) / lR.length : 0;
  const ev   = wr * avgW + (1 - wr) * avgL;
  const gw   = wR.reduce(function(a,b){return a+b;},0);
  const gl   = Math.abs(lR.reduce(function(a,b){return a+b;},0));
  const pf   = gl ? gw / gl : gw > 0 ? 99 : 0;
  const totalR = closed.reduce(function(s,t){return s+calcR(t.pnl_dollars,rv);},0);
  const totalD = closed.reduce(function(s,t){return s+(t.pnl_dollars||0);},0);
  let mxW=0,mxL=0,cW=0,cL=0;
  closed.forEach(function(t){const res=getTradeResult(t);if(res==="Win"){cW++;cL=0;mxW=Math.max(mxW,cW);}else if(res==="Loss"){cL++;cW=0;mxL=Math.max(mxL,cL);}else{cW=0;cL=0;}});
  const rev=[...closed].reverse(); let pk=0,maxDD=0,cum=0;
  rev.forEach(function(t){cum+=calcR(t.pnl_dollars,rv);if(cum>pk)pk=cum;const dd=pk-cum;if(dd>maxDD)maxDD=dd;});
  const wDur = wins.filter(function(t){return t.duration!=null;});
  const lDur = losses.filter(function(t){return t.duration!=null;});
  return {
    n:closed.length, w:wins.length, l:losses.length, be:bes.length,
    wr:wr*100, avgW:avgW, avgL:avgL, ev:ev, pf:pf, totalR:totalR, totalD:totalD,
    maxConsecW:mxW, maxConsecL:mxL, maxDD:maxDD,
    rf: maxDD > 0 ? totalR / maxDD : totalR > 0 ? Infinity : 0,
    avgDurW: wDur.length ? wDur.reduce(function(s,t){return s+t.duration;},0)/wDur.length : null,
    avgDurL: lDur.length ? lDur.reduce(function(s,t){return s+t.duration;},0)/lDur.length : null,
  };
}
function groupBy(trades, fn, rv) {
  const g = {};
  trades.forEach(function(t) { const k = fn(t); if (!g[k]) g[k] = []; g[k].push(t); });
  const result = {};
  const keys = Object.keys(g);
  for (let i = 0; i < keys.length; i++) { result[keys[i]] = calcStats(g[keys[i]], rv); }
  return result;
}

// DAILY P&L BAR CHART
function DailyPnlChart({trades, rv}) {
  const byDate = {};
  trades.filter(function(t){return getTradeResult(t)!=="Open";}).forEach(function(t){
    if (!byDate[t.date]) byDate[t.date]=0;
    byDate[t.date]+=(t.pnl_dollars||0);
  });
  const days = Object.keys(byDate).sort();
  if (days.length < 2) return null;
  const vals = days.map(function(d){return calcR(byDate[d],rv);});
  const maxAbs = Math.max.apply(null, vals.map(Math.abs).concat([0.1]));
  const W=560,H=100,PAD=24,inner=W-PAD*2;
  const slotW = inner/days.length;
  const bW = Math.min(28, slotW-4);
  const midY = PAD+H/2;
  return(
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"16px 20px",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>

        <span style={{fontSize:10,color:C.sub}}>{days.length} giorni</span>
      </div>
      <svg viewBox={"0 0 "+W+" "+(H+PAD)} width="100%" style={{display:"block"}}>
        <line x1={PAD} y1={midY} x2={W-PAD} y2={midY} stroke={C.border} strokeWidth="1"/>
        {vals.map(function(v,i){
          const x=PAD+i*slotW+(slotW-bW)/2;
          const barH=Math.max(2, Math.abs(v)/maxAbs*(H/2-4));
          const y=v>=0?midY-barH:midY;
          const col=v>=0?C.green:C.red;
          return(
            <g key={i}>
              <rect x={x} y={y} width={bW} height={barH} fill={col} rx="2" opacity="0.85"/>
              {days.length<=20&&<text x={x+bW/2} y={H+PAD+12} fill={C.sub} fontSize="7" textAnchor="middle">{days[i].slice(5)}</text>}
            </g>
          );
        })}
        <text x={PAD-4} y={PAD+8}   fill={C.sub} fontSize="8" textAnchor="end">{"+"+maxAbs.toFixed(1)+"R"}</text>
        <text x={PAD-4} y={midY+H/2-4} fill={C.sub} fontSize="8" textAnchor="end">{"-"+maxAbs.toFixed(1)+"R"}</text>
      </svg>
    </div>
  );
}

// DURATION ANALYSIS
function DurationAnalysis({trades, rv}) {
  const BUCKETS=[
    {label:"< 2min", min:0,  max:2},
    {label:"2-5min", min:2,  max:5},
    {label:"5-15min",min:5,  max:15},
    {label:"15-30min",min:15,max:30},
    {label:"30-60min",min:30,max:60},
    {label:"> 60min", min:60,max:Infinity},
  ];
  const closed=trades.filter(function(t){return getTradeResult(t)!=="Open"&&t.duration!=null;});
  if (!closed.length) return null;
  const buckets=BUCKETS.map(function(b){
    const grp=closed.filter(function(t){return t.duration>=b.min&&t.duration<b.max;});
    const wins=grp.filter(function(t){return getTradeResult(t)==="Win";}).length;
    const losses=grp.filter(function(t){return getTradeResult(t)==="Loss";}).length;
    const totalPnl=grp.reduce(function(s,t){return s+(t.pnl_dollars||0);},0);
    return {label:b.label,n:grp.length,wr:wins+losses?wins/(wins+losses)*100:null,r:calcR(totalPnl,rv)};
  }).filter(function(b){return b.n>0;});
  if (!buckets.length) return null;
  const maxR=Math.max.apply(null,buckets.map(function(b){return Math.abs(b.r);}).concat([0.1]));

    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"16px 20px",marginBottom:14}}>

          <div style={{fontSize:12,color:C.gold,marginBottom:10,fontWeight:700}}>Win Rate per durata</div>

                </div>
                <div style={{height:5,background:C.muted,borderRadius:3}}>
                  {b.wr!==null&&<div style={{width:b.wr+"%",height:"100%",background:b.wr>=50?C.green:C.red,borderRadius:3}}/>}
                </div>
              </div>
            );
          })}
        </div>
        <div>
          <div style={{fontSize:12,color:C.gold,marginBottom:10,fontWeight:700}}>P&L per durata</div>
          {buckets.map(function(b,i){
            const w=Math.abs(b.r)/maxR*100;
            return(
              <div key={i} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:11,color:C.gold}}>{b.label}</span>

// EQUITY CURVE
function EquityCurve({trades, rv, showOnlyR}) {
  const closed = [...trades].filter(function(t){return getTradeResult(t)!=="Open";}).reverse();
  if (closed.length < 2) return null;
  const pts = [0]; let cum = 0;
  closed.forEach(function(t){ cum += calcR(t.pnl_dollars, rv); pts.push(parseFloat(cum.toFixed(2))); });
  const mn=Math.min(...pts), mx=Math.max(...pts), rng=mx-mn||1;
  const W=560,H=110,P=22,iW=W-P*2,iH=H-P*2;
  const x = function(i){ return P+(i/(pts.length-1))*iW; };
  const y = function(v){ return P+iH-((v-mn)/rng)*iH; };
  const path = pts.map(function(v,i){ return (i===0?"M":"L")+x(i).toFixed(1)+","+y(v).toFixed(1); }).join(" ");
  const fill = path+" L"+x(pts.length-1).toFixed(1)+","+(P+iH).toFixed(1)+" L"+P+","+(P+iH).toFixed(1)+" Z";
  const last=pts[pts.length-1], lc=last>=0?C.green:C.red, showZ=mn<0&&mx>0;
  let pk2=0,maxDD2=0;
  pts.forEach(function(v){if(v>pk2)pk2=v;const dd=pk2-v;if(dd>maxDD2)maxDD2=dd;});
  return (
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"16px 20px",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <span style={{fontSize:12,color:C.text,letterSpacing:"0.11em",textTransform:"uppercase",fontWeight:700}}>{"Equity Curve - 1R = $"+rv}</span>
        <div style={{display:"flex",gap:24}}>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:9,color:C.sub,marginBottom:2}}>Total R</div>
            <div style={{fontSize:16,fontWeight:700,color:lc}}>{fmtR(last)}</div>
            {!showOnlyR && <div style={{fontSize:11,color:lc,opacity:0.65}}>{fmtD(last*rv)}</div>}
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:9,color:C.sub,marginBottom:2}}>Max DD</div>
            <div style={{fontSize:16,fontWeight:700,color:C.red}}>{"-"+maxDD2.toFixed(2)+"R"}</div>
            {!showOnlyR && <div style={{fontSize:11,color:C.red,opacity:0.65}}>{"$"+Math.round(maxDD2*rv).toLocaleString()}</div>}
          </div>
        </div>
      </div>
      <svg viewBox={"0 0 "+W+" "+H} width="100%" style={{display:"block"}}>
        <line x1={P} y1={P+iH*0.33} x2={W-P} y2={P+iH*0.33} stroke="#14141A" strokeWidth="1"/>
        <line x1={P} y1={P+iH*0.67} x2={W-P} y2={P+iH*0.67} stroke="#14141A" strokeWidth="1"/>
        {showZ && <line x1={P} y1={y(0)} x2={W-P} y2={y(0)} stroke="#2A2A34" strokeWidth="0.75" strokeDasharray="4,3"/>}
        <path d={fill} fill={lc+"18"}/>
        <path d={path} fill="none" stroke={lc} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        {pts.map(function(v,i){ return <circle key={i} cx={x(i)} cy={y(v)} r="2" fill={i===0?"#444":v>=(pts[Math.max(0,i-1)]||0)?C.green:C.red}/>; })}
        <text x={P-4} y={P+4}    fill={C.sub} fontSize="8" textAnchor="end">{mx.toFixed(1)+"R"}</text>
        <text x={P-4} y={P+iH+4} fill={C.sub} fontSize="8" textAnchor="end">{mn.toFixed(1)+"R"}</text>
      </svg>
    </div>
  );
}

function weekKey(week) {
  if (!week || !week.length) return "";
  return week[0].dateStr + "_" + week[week.length - 1].dateStr;
}
function toggleWeekSelection(currentKey, clickedKey) {
  return currentKey === clickedKey ? null : clickedKey;
}
function tradesForWeekRow(week, byDate) {
  const out = [];
  for (let d = 0; d < week.length; d++) {
    const dt = byDate[week[d].dateStr];
    if (dt) for (let j = 0; j < dt.length; j++) out.push(dt[j]);
  }
  return out;
}
function weekRangeLabel(week) {
  if (!week || !week.length) return "";
  const first = week[0].dateStr.split("-").map(Number);
  const last  = week[week.length - 1].dateStr.split("-").map(Number);
  const fMonth = MONTHS_IT[first[1] - 1].toUpperCase();
  const lMonth = MONTHS_IT[last[1] - 1].toUpperCase();
  if (first[1] === last[1]) return first[2] + "-" + last[2] + " " + lMonth;
  return first[2] + " " + fMonth + " - " + last[2] + " " + lMonth;
}
function productFamily(trade) {
  const raw = [trade && trade.product, trade && trade.contract];
  for (let i = 0; i < raw.length; i++) {
    const symbol = String(raw[i] || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (/^M?ES([FGHJKMNQUVXZ][0-9][0-9]?)?$/.test(symbol)) return "ES";
    if (/^M?NQ([FGHJKMNQUVXZ][0-9][0-9]?)?$/.test(symbol)) return "NQ";
  }
  return "OTHER";
}
function fmtPfValue(m) {
  if (!m) return "-";
  if (!isFinite(m.pf) || isNaN(m.pf)) return "99.00";
  return m.pf.toFixed(2);
}
function WeekMetric({label, value, color}) {
  return (
    <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:8,padding:"12px 14px",minHeight:70}}>
      <div style={{fontSize:9,color:C.sub,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:6}}>{label}</div>
      <div style={{fontSize:17,fontWeight:700,color:color||C.text,lineHeight:1.05}}>{value}</div>

}

  const now = new Date();

  const byDate = {};
  trades.forEach(function(t){ if (!byDate[t.date]) byDate[t.date]=[]; byDate[t.date].push(t); });
  function dayStats(ds) {
    const dt = byDate[ds]; if (!dt || !dt.length) return null;
    const closed = dt.filter(function(t){ return getTradeResult(t) !== "Open"; }); if (!closed.length) return null;
    const totalPnl = closed.reduce(function(s,t){ return s+(t.pnl_dollars||0); }, 0);
    const wins = closed.filter(function(t){ return getTradeResult(t) === "Win"; }).length;
    const losses = closed.filter(function(t){ return getTradeResult(t) === "Loss"; }).length;
    return { n: closed.length, totalPnl: totalPnl, wr: wins + losses ? wins / (wins + losses) * 100 : 0 };
  }
  const weeks = getCalendarWeeks(year, month);
  const weekRows = weeks.map(function(week){
    const k = weekKey(week);
    return { key: k, week: week, trades: tradesForWeekRow(week, byDate) };
  });

    const p = t.date.split("-").map(Number); return p[0]===year && p[1]-1===month;
  });

          <div style={{display:"flex",alignItems:"center",gap:14}}>

            <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:700,color:C.text,letterSpacing:"0.08em"}}>{MONTHS_IT[month].toUpperCase()+" "+year}</span>
            <button onClick={nextM} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:15,padding:"4px 12px",cursor:"pointer",fontFamily:"inherit"}}>{">"}</button>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <button onClick={onToggleR} style={{padding:"6px 12px",background:showOnlyR?C.gold+"20":"transparent",border:"1px solid "+(showOnlyR?C.gold:C.border),borderRadius:20,color:showOnlyR?C.gold:C.sub,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",fontWeight:showOnlyR?700:400}}>
              {showOnlyR?"R":"R / $"}

            {ohlcMeta && <span style={{fontSize:10,color:C.green,border:"1px solid "+C.green+"30",borderRadius:4,padding:"3px 8px"}}>{"OHLC "+ohlcMeta.days+"gg"}</span>}

            <button onClick={onExport}   style={{padding:"7px 14px",background:"transparent",border:"1px solid "+C.gold+"50",borderRadius:4,color:C.gold,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase"}}>{"EXPORT"}</button>
          </div>
        </div>
        {ms && (
          <div style={{display:"flex",gap:24,paddingTop:12,borderTop:"0.5px solid "+C.muted}}>
            <div>

              <div style={{fontSize:18,fontWeight:700,color:ms.totalR>=0?C.green:C.red}}>{fmtR(ms.totalR)}</div>

                <div style={{fontSize:9,color:C.sub,marginBottom:2,letterSpacing:"0.1em"}}>{item.label}</div>

      <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"16px"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr) 80px",gap:6,marginBottom:8}}>

  );
}

function TWImportModal({onClose, onSave, existing}) {
  const [parsed,  setParsed]  = useState(null);
  const [error,   setError]   = useState("");
  const [saving,  setSaving]  = useState(false);
  function handleFile(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = parseTWCsv(ev.target.result);
        if (!data.length){ setError("Nessuna candela valida."); return; }
        const times = data.map(function(c){return c.time;});
        const first = unixToETDate(Math.min.apply(null,times));
        const last  = unixToETDate(Math.max.apply(null,times));
        const daySet = {};
        data.forEach(function(c){ daySet[unixToETDate(c.time)]=1; });
        const days = Object.keys(daySet).length;
        setParsed({data:data,first:first,last:last,n:data.length,days:days}); setError("");
      } catch(err){ setError("Errore: "+err.message); }
    };
    reader.readAsText(file);
  }
  async function handleSave(){
    if (!parsed) return; setSaving(true);
    await onSave(parsed.data,{first:parsed.first,last:parsed.last,n:parsed.n,days:parsed.days});

    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>

// EXPORT MODAL
function ExportModal({trades, rv, onClose}) {
  const headers = ["date","entry_time","exit_time","duration","direction","entry_price","exit_price","pnl_dollars","r","result","product","partial","notes"];
  const rows = [...trades].reverse().map(function(t){
    return headers.map(function(h){
      if (h==="r")       return '"'+calcR(t.pnl_dollars||0,rv).toFixed(2)+'"';
      if (h==="result")  return '"'+getTradeResult(t)+'"';
      if (h==="partial") return '"'+( t.partial?"Si":"No")+'"';
      return '"'+String(t[h]||"").replace(/"/g,'\'\'')+'"';
    }).join(",");
  });
  const csv = [headers.join(","), ...rows].join("\n");
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.90)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:12,padding:24,width:"100%",maxWidth:680}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <span style={{fontSize:13,color:C.text,fontWeight:600,letterSpacing:"0.08em"}}>EXPORT CSV</span>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:C.sub,fontSize:22,cursor:"pointer",lineHeight:1}}>{"X"}</button>
        </div>
        <textarea readOnly value={csv} rows={10} onFocus={function(e){e.target.select();}} style={{width:"100%",background:C.card,border:"1px solid "+C.border,borderRadius:6,color:C.sub,fontSize:10,padding:"12px",fontFamily:"'IBM Plex Mono',monospace",outline:"none",resize:"none",boxSizing:"border-box"}}/>
        <div style={{display:"flex",gap:10,marginTop:12}}>
          <button onClick={function(){navigator.clipboard.writeText(csv);}} style={{padding:"8px 20px",background:"transparent",border:"1px solid "+C.gold,borderRadius:4,color:C.gold,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase"}}>COPIA TUTTO</button>
          <button onClick={onClose} style={{fontSize:11,color:C.sub,background:"transparent",border:"none",cursor:"pointer",fontFamily:"inherit"}}>Chiudi</button>
        </div>
      </div>
    </div>
  );
}

// SETTINGS MODAL
function SettingsModal({rv, onSave, onClose}) {
  const [val, setVal] = useState(String(rv));
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.90)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:12,padding:26,width:380}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
          <span style={{fontSize:13,color:C.text,fontWeight:600,letterSpacing:"0.08em"}}>IMPOSTAZIONI</span>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:C.sub,fontSize:22,cursor:"pointer",lineHeight:1}}>{"X"}</button>
        </div>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:10,color:C.sub,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:10}}>{"1R = $ - valore fisso in dollari"}</div>
          <input type="number" value={val} onChange={function(e){setVal(e.target.value);}} min="1" step="25" style={{width:"100%",background:C.card,border:"1px solid "+C.border,borderRadius:4,color:C.text,fontSize:22,fontWeight:700,padding:"12px 16px",fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}/>
          <div style={{fontSize:10,color:C.sub,marginTop:8}}>{"Default $250 - Aggiorna ad ogni nuovo conto prop"}</div>
          <div style={{fontSize:10,color:C.sub,marginTop:4}}>{"Esempio: +$500 -> "+(500/(Number(val)||250)).toFixed(2)+"R"}</div>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={function(){onSave(Number(val)||R_DEFAULT);}} style={{padding:"10px 26px",background:"transparent",border:"1px solid "+C.gold,borderRadius:4,color:C.gold,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.12em",textTransform:"uppercase"}}>SALVA</button>
          <button onClick={onClose} style={{fontSize:11,color:C.sub,background:"transparent",border:"none",cursor:"pointer",fontFamily:"inherit"}}>Annulla</button>
        </div>
      </div>
    </div>
  );
}

// MAIN APP
function Journal() {
  const [tab,          setTab]          = useState("dashboard");
  const [trades,       setTrades]       = useState([]);
  const [rv,           setRv]           = useState(R_DEFAULT);
  const [ohlcData,     setOhlcData]     = useState([]);
  const [ohlcMeta,     setOhlcMeta]     = useState(null);
  const [ohlcNQ,       setOhlcNQ]       = useState([]);
  const [ohlcMetaNQ,   setOhlcMetaNQ]   = useState(null);
  const [showOnlyR,    setShowOnlyR]    = useState(false);
  const [loading,      setLoading]      = useState(true);
  const [showImport,   setShowImport]   = useState(false);
  const [showExport,   setShowExport]   = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showTWImport, setShowTWImport] = useState(false);
  const [time,         setTime]         = useState("");
  function getTime(){
    const d=new Date();
    return DOW_IT[d.getDay()]+" "+d.toLocaleDateString("it-IT")+" "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  }
  useEffect(function(){
    setTime(getTime());
    const t=setInterval(function(){setTime(getTime());},30000);
    return function(){clearInterval(t);};
  },[]);
  useEffect(function(){
    (async function(){
      try{
        const tr=await storage.get("jnl:v2:trades");
        const st=await storage.get("jnl:v2:settings");
        const oh=await storage.get("jnl:v2:ohlc");
        const om=await storage.get("jnl:v2:ohlcmeta");
        if(tr) setTrades(JSON.parse(tr.value));
        // else: journal vuoto, pronto per trade reali
        if(st){ const s=JSON.parse(st.value); if(s.rv) setRv(s.rv); }
        if(oh){ const arr=JSON.parse(oh.value); setOhlcData(arr.map(function(c){return{time:c[0],high:c[1],low:c[2]};})); }
        if(om) setOhlcMeta(JSON.parse(om.value));
        const onq=await storage.get("jnl:v2:ohlcNQ");
        const omq=await storage.get("jnl:v2:ohlcMetaNQ");
        if(onq){ const arr=JSON.parse(onq.value); setOhlcNQ(arr.map(function(c){return{time:c[0],high:c[1],low:c[2]};})); }
        if(omq) setOhlcMetaNQ(JSON.parse(omq.value));
      }catch(e){}
      setLoading(false);
    })();
  },[]);
  async function saveSettings(newR){
    setRv(newR);
    try{ await storage.set("jnl:v2:settings",JSON.stringify({rv:newR})); }catch(e){}
    setShowSettings(false);
  }
  async function saveTWOhlc(data, meta){
    const product = detectOHLCProduct(data);
    meta.product = product;
    const compact = data.map(function(c){return[c.time,c.high,c.low];});
    if (product === "NQ") {
      setOhlcNQ(data); setOhlcMetaNQ(meta);
      try{ await storage.set("jnl:v2:ohlcNQ",JSON.stringify(compact)); await storage.set("jnl:v2:ohlcMetaNQ",JSON.stringify(meta)); }catch(e){}
    } else {
      setOhlcData(data); setOhlcMeta(meta);
      try{ await storage.set("jnl:v2:ohlc",JSON.stringify(compact)); await storage.set("jnl:v2:ohlcmeta",JSON.stringify(meta)); }catch(e){}
    }
  }
  function toggleR(){ setShowOnlyR(function(v){return !v;}); }
  const TABS = [{k:"dashboard",l:"DASHBOARD"},{k:"calendario",l:"CALENDARIO"},{k:"settimanale",l:"SETTIMANALE"}];
  if (loading) return (
    <div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.sub,fontFamily:"'IBM Plex Mono',monospace",fontSize:12}}>
      Caricamento...
    </div>
  );
  return (
    <div style={{fontFamily:"'IBM Plex Mono','Courier New',monospace",fontSize:13,background:C.bg,minHeight:"100vh",color:C.text,padding:"20px 22px",boxSizing:"border-box"}}>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet"/>
      {showImport    && <ImportModal   onClose={function(){setShowImport(false);}}   trades={trades} setTrades={setTrades}/>}
      {showExport    && <ExportModal   trades={trades} rv={rv}                        onClose={function(){setShowExport(false);}}/>}
      {showSettings  && <SettingsModal rv={rv}         onSave={saveSettings}          onClose={function(){setShowSettings(false);}}/>}
      {showTWImport  && <TWImportModal onClose={function(){setShowTWImport(false);}}  onSave={saveTWOhlc} existing={ohlcMeta}/>}
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:22,paddingBottom:18,borderBottom:"1px solid "+C.border}}>
        <div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:36,fontWeight:700,color:C.text,letterSpacing:"0.04em",lineHeight:1}}>
            {"Hello "}<span style={{color:C.gold}}>Noemi</span>
          </div>
          <div style={{fontSize:10,color:C.sub,marginTop:5,letterSpacing:"0.12em"}}>
            {"ES FUTURES JOURNAL - "+trades.length+" trade - 1R = $"+rv}
            {ohlcMeta && <span style={{color:C.green,marginLeft:10}}>{"- ES OHLC "+ohlcMeta.days+"gg"}</span>}
            {ohlcMetaNQ && <span style={{color:C.blue,marginLeft:6}}>{"- NQ OHLC "+ohlcMetaNQ.days+"gg"}</span>}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
          <span style={{fontSize:11,color:C.sub}}>{time}</span>
          <button onClick={function(){setShowSettings(true);}} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:10,padding:"5px 14px",cursor:"pointer",fontFamily:"inherit",letterSpacing:"0.1em",textTransform:"uppercase"}}>
            {"settings"}
          </button>
        </div>
      </div>
      <div style={{display:"flex",borderBottom:"1px solid "+C.border,marginBottom:22,gap:2}}>
        {TABS.map(function(t){
          return (
            <button key={t.k} onClick={function(){setTab(t.k);}} style={{padding:"10px 26px",fontSize:13,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,letterSpacing:"0.14em",cursor:"pointer",background:"transparent",border:"none",borderBottom:"2px solid "+(tab===t.k?C.gold:C.border),color:tab===t.k?C.gold:C.sub,transition:"all 0.15s"}}>
              {t.l}
            </button>
          );
        })}
      </div>
      {tab==="dashboard"   && <Dashboard      trades={trades} rv={rv} ohlcData={ohlcData} ohlcNQ={ohlcNQ} showOnlyR={showOnlyR} onToggleR={toggleR}/>}
      {tab==="calendario"  && <CalendarioView  trades={trades} rv={rv} onImport={function(){setShowImport(true);}} onExport={function(){setShowExport(true);}} onTWImport={function(){setShowTWImport(true);}} ohlcMeta={ohlcMeta} showOnlyR={showOnlyR} onToggleR={toggleR}/>}
      {tab==="settimanale" && <SettimanaleView/>}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(Journal));
  </script>
</body>
</html>
