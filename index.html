    const { useState, useEffect, useRef } = React;

    // localStorage shim - persistent browser storage
    const storage = {
      get: async function(key) {
        const v = localStorage.getItem(key);
        return v == null ? null : { value: v };
      },
      set: async function(key, value) {
        writeJournalEntries(localStorage, {[key]:value});
        return { key: key, value: value };
      },
      delete: async function(key) {
        localStorage.removeItem(key);
        return { key: key, deleted: true };
      }
    };

// A candle import updates several keys; either all are saved or the old values return.
function writeJournalEntries(target, entries) {
  const keys = Object.keys(entries);
  const before = {};
  const written = [];
  keys.forEach(function(key){ before[key] = target.getItem(key); });
  try {
    keys.forEach(function(key){
      if (before[key] === entries[key]) return;
      target.setItem(key, entries[key]);
      written.push(key);
      if (target.getItem(key) !== entries[key]) throw new Error("Verifica scrittura fallita");
    });
  } catch(error) {
    let rollbackFailed = false;
    written.reverse().forEach(function(key){
      try {
        if (before[key] == null) target.removeItem(key);
        else target.setItem(key, before[key]);
        if (target.getItem(key) !== before[key]) rollbackFailed = true;
      } catch(e) { rollbackFailed = true; }
    });
    throw new Error(rollbackFailed
      ? "Salvataggio e ripristino non riusciti. Non chiudere la pagina: esporta un backup e verifica i dati."
      : "Salvataggio non riuscito: memoria del browser piena o non disponibile. I dati precedenti sono invariati.");
  }
}

function validRValue(value) {
  const n = Number(value);
  return Number.isFinite(n) && n > 0;
}

function useWeeklyDocument(key, emptyData) {
  const [data, setData] = useState(emptyData);
  const [loadedKey, setLoadedKey] = useState("");
  const [error, setError] = useState("");
  const [flash, setFlash] = useState("");
  const currentKey = useRef(key);
  const draft = useRef(emptyData);
  const timer = useRef(null);
  currentKey.current = key;
  useEffect(function(){
    let active = true;
    setError(""); setFlash(""); setLoadedKey("");
    (async function(){
      try {
        const stored = await storage.get(key);
        const parsed = stored ? JSON.parse(stored.value) : emptyData;
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("Formato non valido");
        if (active) { draft.current = parsed; setData(parsed); setLoadedKey(key); }
      } catch(e) { if (active) setError("Lettura della settimana non riuscita. Nessun dato e stato sovrascritto."); }
    })();
    return function(){ active = false; clearTimeout(timer.current); };
  }, [key]);
  async function save(nextData) {
    if (loadedKey !== key) return;
    const payload = nextData || draft.current;
    clearTimeout(timer.current);
    setFlash("");
    try {
      await storage.set(key, JSON.stringify(payload));
      if (currentKey.current !== key) return;
      setError(""); setFlash("Salvato OK");
      timer.current = setTimeout(function(){ setFlash(""); }, 1600);
    } catch(e) { if (currentKey.current === key) { setFlash(""); setError(e.message); } }
  }
  function update(next) {
    draft.current = next;
    setData(next);
    save(next);
  }
  return {data:data, update:update, save:save, flash:flash, error:error, ready:loadedKey === key};
}

// HELPERS
function getFascia(t) {
  if (!t) return "Altro";
  const parts = t.split(":"); const h = Number(parts[0]); const m = Number(parts[1]);
  const mins = h * 60 + m;
  if (mins >= 570 && mins <= 600) return "Gold Zone";      // 9:30-10:00
  if (mins >= 601 && mins <= 630) return "Silver Zone";    // 10:01-10:30
  if (mins >= 631 && mins <= 660) return "Dead Zone";      // 10:31-11:00
  if (mins >= 661 && mins <= 720) return "Mid AM";         // 11:01-12:00
  if (mins >= 721 && mins <= 779) return "Lunch";          // 12:01-12:59
  if (mins >= 780 && mins <= 840) return "PM Post Lunch";  // 13:00-14:00
  if (mins >= 841 && mins <= 899) return "PM Session";     // 14:01-14:59
  if (mins >= 900)                return "Power Hour";     // 15:00+
  return "Altro";
}
function getSession(t) {
  if (!t) return "AM";
  const parts = t.split(":"); const h = Number(parts[0]); const m = Number(parts[1]);
  const mins = h * 60 + m;
  if (mins < 570) return "Pre Market";
  if (mins < 720) return "AM";
  if (mins < 900) return "PM";
  return "Power Hour";
}
function calcR(pnl, rv)  { return pnl / rv; }
function getTradeResult(t) {
  if (!t || t.result === "Open") return "Open";
  const pnl = Number(t.pnl_dollars || 0);
  if (Math.abs(pnl) <= BE_THRESHOLD_DOLLARS) return "BE";
  return pnl > 0 ? "Win" : pnl < 0 ? "Loss" : "BE";
}
function tradeChronologyKey(t) {
  const date = String(t && t.date || "");
  const entry = String(t && t.entry_time || "00:00").padStart(5,"0");
  const exit = String(t && t.exit_time || "00:00").padStart(5,"0");
  return date + "T" + entry + "T" + exit + "T" + String(t && t.id || "");
}
function sortTradesChronologically(trades) {
  return (trades || []).slice().sort(function(a,b){
    return tradeChronologyKey(a).localeCompare(tradeChronologyKey(b));
  });
}
function calcWinRatePercent(wins, losses) {
  return wins + losses ? wins / (wins + losses) * 100 : 0;
}
function makeJournalBackupError(message, code) {
  const error = new Error(message);
  error.code = code || "JOURNAL_BACKUP_ERROR";
  return error;
}
function isPlainBackupObject(value) {
  return !!value && typeof value === "object" && !Array.isArray(value);
}
function journalStorageKeys(storageLike) {
  if (!storageLike || typeof storageLike.key !== "function" || typeof storageLike.getItem !== "function") {
    throw makeJournalBackupError("Journal storage is unavailable.", "STORAGE_UNAVAILABLE");
  }
  const keys = [];
  const seen = {};
  const length = Number(storageLike.length) || 0;
  for (let i = 0; i < length; i++) {
    const key = storageLike.key(i);
    if (typeof key === "string" && key.startsWith(JOURNAL_STORAGE_NAMESPACE) && !seen[key]) {
      seen[key] = true;
      keys.push(key);
    }
  }
  return keys.sort();
}
function collectJournalStorageItems(storageLike) {
  const items = {};
  journalStorageKeys(storageLike).forEach(function(key){
    const value = storageLike.getItem(key);
    if (typeof value !== "string") {
      throw makeJournalBackupError("Unable to read all Journal data.", "STORAGE_READ_FAILED");
    }
    items[key] = value;
  });
  return items;
}
function createJournalBackup(storageLike, now) {
  const items = collectJournalStorageItems(storageLike);
  const keys = Object.keys(items);
  if (!keys.length) throw makeJournalBackupError("No Journal data found to export.", "EMPTY_JOURNAL");
  const date = now == null ? new Date() : new Date(now);
  if (!isFinite(date.getTime())) throw makeJournalBackupError("Unable to create the backup timestamp.", "INVALID_DATE");
  return {
    format:JOURNAL_BACKUP_FORMAT,
    backupVersion:JOURNAL_BACKUP_VERSION,
    namespace:JOURNAL_STORAGE_NAMESPACE,
    exportedAt:date.toISOString(),
    itemCount:keys.length,
    items:items,
  };
}
function validateJournalBackup(backup) {
  const invalid = function(message, code){
    throw makeJournalBackupError(message || "Invalid or corrupted Journal backup.", code || "INVALID_BACKUP");
  };
  if (!isPlainBackupObject(backup)) invalid();
  if (backup.format !== JOURNAL_BACKUP_FORMAT) invalid("Invalid or corrupted Journal backup.", "INVALID_FORMAT");
  if (backup.backupVersion !== JOURNAL_BACKUP_VERSION) invalid("Unsupported Journal backup version.", "UNSUPPORTED_VERSION");
  if (backup.namespace !== JOURNAL_STORAGE_NAMESPACE) invalid("Invalid Journal backup namespace.", "INVALID_NAMESPACE");
  if (typeof backup.exportedAt !== "string" || !isFinite(new Date(backup.exportedAt).getTime())) invalid("Invalid Journal backup date.", "INVALID_DATE");
  if (!isPlainBackupObject(backup.items)) invalid("Invalid or corrupted Journal backup.", "INVALID_ITEMS");
  const keys = Object.keys(backup.items);
  if (!keys.length) invalid("Journal backup is empty.", "EMPTY_BACKUP");
  if (!Number.isInteger(backup.itemCount) || backup.itemCount !== keys.length) invalid("Invalid Journal backup item count.", "INVALID_ITEM_COUNT");
  const items = {};
  keys.sort().forEach(function(key){
    if (!key.startsWith(JOURNAL_STORAGE_NAMESPACE)) invalid("Journal backup contains a foreign storage key.", "FOREIGN_KEY");
    if (typeof backup.items[key] !== "string") invalid("Journal backup contains an invalid storage value.", "INVALID_VALUE");
    items[key] = backup.items[key];
  });
  return {
    format:JOURNAL_BACKUP_FORMAT,
    backupVersion:JOURNAL_BACKUP_VERSION,
    namespace:JOURNAL_STORAGE_NAMESPACE,
    exportedAt:backup.exportedAt,
    itemCount:keys.length,
    items:items,
  };
}
function parseJournalBackupText(text) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (error) { throw makeJournalBackupError("Invalid or corrupted Journal backup.", "INVALID_JSON"); }
  return validateJournalBackup(parsed);
}
function replaceJournalStorageItems(storageLike, items) {
  const expectedKeys = Object.keys(items).sort();
  journalStorageKeys(storageLike).forEach(function(key){
    storageLike.removeItem(key);
    if (storageLike.getItem(key) !== null) throw makeJournalBackupError("Unable to replace current Journal data.", "STORAGE_REMOVE_FAILED");
  });
  expectedKeys.forEach(function(key){
    storageLike.setItem(key, items[key]);
    if (storageLike.getItem(key) !== items[key]) throw makeJournalBackupError("Unable to write all Journal backup data.", "STORAGE_WRITE_FAILED");
  });
  const written = collectJournalStorageItems(storageLike);
  const writtenKeys = Object.keys(written).sort();
  if (writtenKeys.length !== expectedKeys.length) throw makeJournalBackupError("Journal restore verification failed.", "RESTORE_VERIFY_FAILED");
  for (let i = 0; i < expectedKeys.length; i++) {
    const key = expectedKeys[i];
    if (writtenKeys[i] !== key || written[key] !== items[key]) throw makeJournalBackupError("Journal restore verification failed.", "RESTORE_VERIFY_FAILED");
  }
}
function restoreJournalBackup(storageLike, backup) {
  const validated = validateJournalBackup(backup);
  const snapshot = collectJournalStorageItems(storageLike);
  try {
    replaceJournalStorageItems(storageLike, validated.items);
  } catch (restoreError) {
    try {
      replaceJournalStorageItems(storageLike, snapshot);
    } catch (rollbackError) {
      const fatal = makeJournalBackupError("Restore failed and the automatic rollback could not be verified.", "ROLLBACK_FAILED");
      fatal.restoreError = restoreError;
      fatal.rollbackError = rollbackError;
      throw fatal;
    }
    const rolledBack = makeJournalBackupError("Restore failed. Current Journal data was restored.", "RESTORE_FAILED");
    rolledBack.restoreError = restoreError;
    throw rolledBack;
  }
  return { itemCount:validated.itemCount, exportedAt:validated.exportedAt };
}
function journalBackupFilename(now) {
  const date = now == null ? new Date() : new Date(now);
  const pad = function(value){ return String(value).padStart(2,"0"); };
  return "hello-noemi-journal-backup-" + date.getFullYear() + "-" + pad(date.getMonth()+1) + "-" + pad(date.getDate()) + "-" + pad(date.getHours()) + pad(date.getMinutes()) + ".json";
}
function fmtR(r)         { if (r == null || isNaN(r)) return "-"; return (r >= 0 ? "+" : "") + r.toFixed(2) + "R"; }

function parseTradovateCSV(text) {

  if (lines.length < 2) return { trades: [], errors: ["File vuoto."] };

  if (header.indexOf("Bought Timestamp") === -1) {

  }

  const errors = [];

  for (let i = 1; i < lines.length; i++) {
    try {
      const row = parseCSVLine(lines[i]);
      const obj = {};
      for (let j = 0; j < header.length; j++) { obj[header[j]] = row[j] || ""; }
      const boughtTs = obj["Bought Timestamp"];
      const soldTs   = obj["Sold Timestamp"];
      if (!boughtTs || !soldTs) continue;
      const pairId = obj["Pair ID"] || "";
      const dedupeKey = pairId ? ("pair:" + pairId) : ("row:" + lines[i]);
      if (seenRows[dedupeKey]) continue;
      seenRows[dedupeKey] = true;
      const bParts = boughtTs.split(" "); const bDate = bParts[0]; const bTime = bParts[1];
      const sParts = soldTs.split(" ");   const sDate = sParts[0]; const sTime = sParts[1];
      const bDt = parseTradeTimestamp(boughtTs);
      const sDt = parseTradeTimestamp(soldTs);
      if (!bDt || !sDt) continue;
      const isBuy = bDt.getTime() <= sDt.getTime();
      const qty = parseMoney(obj["Paired Qty"]);
      if (qty <= 0) continue;
      const buyPrice  = parseMoney(obj["Buy Price"]);
      const sellPrice = parseMoney(obj["Sell Price"]);
      const pnl = parseMoney(obj["P/L"]);
      const posId  = obj["Position ID"] || "";
      const legacyId = (posId && pairId) ? (posId + "_" + pairId) : ("tv_" + i);
      lots.push({
        rowIndex: i,
        legacyId: legacyId,
        positionId: posId,
        pairId: pairId,
        buyFillId: obj["Buy Fill ID"] || "",
        sellFillId: obj["Sell Fill ID"] || "",
        account: obj["Account"] || "",
        contract: obj["Contract"] || "",
        product: obj["Product"] || "ES",
        qty: qty,
        pnl: pnl,
        direction: isBuy ? "Buy" : "Sell",
        entryFillId: isBuy ? (obj["Buy Fill ID"] || "") : (obj["Sell Fill ID"] || ""),
        exitFillId: isBuy ? (obj["Sell Fill ID"] || "") : (obj["Buy Fill ID"] || ""),
        entryTs: isBuy ? bDt.getTime() : sDt.getTime(),
        exitTs: isBuy ? sDt.getTime() : bDt.getTime(),
        entryRawTs: isBuy ? boughtTs : soldTs,
        exitRawTs: isBuy ? soldTs : boughtTs,
        entryPrice: isBuy ? buyPrice : sellPrice,
        exitPrice: isBuy ? sellPrice : buyPrice,
      });
    } catch(e) { errors.push("Riga " + (i + 1) + ": " + e.message); }
  }
  const trades = aggregateTradovateLots(lots);
  const rawPnl = lots.reduce(function(s,l){ return s + l.pnl; }, 0);
  const aggPnl = trades.reduce(function(s,t){ return s + (t.pnl_dollars || 0); }, 0);
  if (Math.abs(rawPnl - aggPnl) > 0.01) {
    errors.push("Warning P/L: raw " + rawPnl.toFixed(2) + " diverso da aggregato " + aggPnl.toFixed(2));
  }
  return { trades: trades, errors: errors };
}

function detectOHLCProduct(data) {
  if (!data || !data.length) return "ES";
  for (let i = 0; i < data.length; i++) {
    const sym = String(data[i].symbol || "").toUpperCase();
    if (/\b(MNQ|NQ)/.test(sym)) return "NQ";
    if (/\b(MES|ES)/.test(sym)) return "ES";
  }
  const mid = (data[0].high + data[0].low) / 2;
  return mid > 15000 ? "NQ" : "ES";
}

    mae:summarizeValues(items.map(function(x){ return x.mae_points; })),
    mfe:summarizeValues(items.map(function(x){ return x.mfe_points; })),
    maeD:summarizeValues(items.map(function(x){ return x.mae_dollars; })),
    mfeD:summarizeValues(items.map(function(x){ return x.mfe_dollars; })),
    maeR:summarizeValues(items.map(function(x){ return x.mae_r; })),
    mfeR:summarizeValues(items.map(function(x){ return x.mfe_r; })),
  };
}
function calcMaeMfeStats(trades, ohlcES, ohlcNQ) {
  if (!trades || !trades.length) return null;
  const results = []; let unavailable = 0; let rUnavailable = 0; let dollarUnavailable = 0;
  for (let i = 0; i < trades.length; i++) {
    const t = trades[i];
    if (!isMaeMfeInScope(t)) continue;
    if (getTradeResult(t) !== "Open" && t.entry_price && t.exit_price) {
      const r = maeMfeForTrade(t, ohlcES, ohlcNQ);
      if (r && r.available) {
        const item = {};
        Object.keys(r).forEach(function(k){ item[k] = r[k]; });
        item.trade = t;
        item.result = getTradeResult(t);
        item.direction = t.direction || "";
        results.push(item);
        if (r.r_status !== "available") rUnavailable++;
        if (r.dollars_status !== "available") dollarUnavailable++;
      } else unavailable++;
    }
  }
  if (!results.length) return null;
  const n = results.length;
  let sumMae = 0; let sumMfe = 0; let sumEff = 0; let cntEff = 0;
  for (let i = 0; i < results.length; i++) {
    sumMae += results[i].mae_points;
    sumMfe += results[i].mfe_points;
    if (results[i].mfe > 0.01) { sumEff += results[i].efficiency; cntEff++; }
  }
  const winners = results.filter(function(x){ return x.result === "Win"; });
  const losers = results.filter(function(x){ return x.result === "Loss"; });
  const esResults = results.filter(function(x){ return x.family === "ES"; });
  const nqResults = results.filter(function(x){ return x.family === "NQ"; });
  const all = maeMfeGroup(results);
  return {
    n:n,
    unavailable:unavailable,
    rUnavailable:rUnavailable,
    dollarUnavailable:dollarUnavailable,
    avgMae:sumMae / n,
    avgMfe:sumMfe / n,
    avgEff:cntEff ? sumEff / cntEff : 0,
    all:all,
    winners:maeMfeGroup(winners),
    losers:maeMfeGroup(losers),
    es:maeMfeGroup(esResults),
    nq:maeMfeGroup(nqResults),
    esWinners:maeMfeGroup(esResults.filter(function(x){ return x.result === "Win"; })),
    esLosers:maeMfeGroup(esResults.filter(function(x){ return x.result === "Loss"; })),
    nqWinners:maeMfeGroup(nqResults.filter(function(x){ return x.result === "Win"; })),
    nqLosers:maeMfeGroup(nqResults.filter(function(x){ return x.result === "Loss"; })),
    longs:maeMfeGroup(results.filter(function(x){ return x.direction === "Buy"; })),
    shorts:maeMfeGroup(results.filter(function(x){ return x.direction === "Sell"; })),
    winnerMfeR:thresholdCounts(winners, "mfe_r", [
      {label:"0.5R",value:0.5},{label:"1R",value:1},{label:"1.5R",value:1.5},{label:"2R",value:2},{label:"2.5R",value:2.5},{label:"3R",value:3},{label:"4R",value:4},{label:"5R+",value:5}
    ]),
    winnerMaeR:thresholdCounts(winners, "mae_r", [
      {label:"0.25R",value:0.25},{label:"0.50R",value:0.5},{label:"0.75R",value:0.75},{label:"1R",value:1}
    ]),
    winnerMaeRanges:rangeCounts(winners, "mae_r", [
      {label:"<=0.25R",min:null,max:0.25},{label:"0.25-0.50R",min:0.25,max:0.5},{label:"0.50-0.75R",min:0.5,max:0.75},{label:"0.75-1R",min:0.75,max:1}
    ]),
    loserMfeR:thresholdCounts(losers, "mfe_r", [
      {label:"0.25R",value:0.25},{label:"0.5R",value:0.5},{label:"0.75R",value:0.75},{label:"1R",value:1},{label:"1.5R",value:1.5},{label:"2R+",value:2}
    ]),
  };
}

// STATS ENGINE
function calcStats(trades, rv) {
  const closed = trades.filter(function(t) { return getTradeResult(t) !== "Open"; });
  if (!closed.length) return null;
  const wins   = closed.filter(function(t) { return getTradeResult(t) === "Win"; });
  const losses = closed.filter(function(t) { return getTradeResult(t) === "Loss"; });
  const bes    = closed.filter(function(t) { return getTradeResult(t) === "BE"; });
  const wr = calcWinRatePercent(wins.length, losses.length) / 100;
  const wR = wins.map(function(t)   { return calcR(t.pnl_dollars, rv); });
  const lR = losses.map(function(t) { return calcR(t.pnl_dollars, rv); });
  const avgW = wR.length ? wR.reduce(function(a,b){return a+b;},0) / wR.length : 0;
  const avgL = lR.length ? lR.reduce(function(a,b){return a+b;},0) / lR.length : 0;
  const ev   = wr * avgW + (1 - wr) * avgL;
  const gw   = wR.reduce(function(a,b){return a+b;},0);
  const gl   = Math.abs(lR.reduce(function(a,b){return a+b;},0));
  const pf   = gl ? gw / gl : gw > 0 ? Infinity : 0;
  const totalR = closed.reduce(function(s,t){return s+calcR(t.pnl_dollars,rv);},0);
  const totalD = closed.reduce(function(s,t){return s+Number(t.pnl_dollars||0);},0);
  const chronological = closed.slice().sort(function(a,b){
    const aKey = String(a && a.date || "") + "T" + String(a && a.entry_time || "00:00").padStart(5,"0") + "T" + String(a && a.exit_time || "00:00").padStart(5,"0") + "T" + String(a && a.id || "");
    const bKey = String(b && b.date || "") + "T" + String(b && b.entry_time || "00:00").padStart(5,"0") + "T" + String(b && b.exit_time || "00:00").padStart(5,"0") + "T" + String(b && b.id || "");
    return aKey.localeCompare(bKey);
  });
  let mxW=0,mxL=0,cW=0,cL=0;
  chronological.forEach(function(t){const res=getTradeResult(t);if(res==="Win"){cW++;cL=0;mxW=Math.max(mxW,cW);}else if(res==="Loss"){cL++;cW=0;mxL=Math.max(mxL,cL);}else{cW=0;cL=0;}});
  let pk=0,maxDD=0,cum=0;
  chronological.forEach(function(t){cum+=calcR(t.pnl_dollars,rv);if(cum>pk)pk=cum;const dd=pk-cum;if(dd>maxDD)maxDD=dd;});
  const wDur = wins.filter(function(t){return t.duration!=null;});
  const lDur = losses.filter(function(t){return t.duration!=null;});
  return {
    n:closed.length, w:wins.length, l:losses.length, be:bes.length,
    wr:wr*100, avgW:avgW, avgL:avgL, ev:ev, pf:pf, totalR:totalR, totalD:totalD,
    maxConsecW:mxW, maxConsecL:mxL, maxDD:maxDD,
    rf: maxDD > 0 ? totalR / maxDD : totalR > 0 ? Infinity : 0,
    avgDurW: wDur.length ? wDur.reduce(function(s,t){return s+Number(t.duration);},0)/wDur.length : null,
    avgDurL: lDur.length ? lDur.reduce(function(s,t){return s+Number(t.duration);},0)/lDur.length : null,
  };
}
function calcPerformanceExtremes(trades, rv) {
  const closed = sortTradesChronologically((trades || []).filter(function(t){ return getTradeResult(t) !== "Open"; }));
  if (!closed.length) return null;
  function tradeMetric(trade) {
    const dollars = Number(trade && trade.pnl_dollars || 0);
    return { trade:trade, date:String(trade && trade.date || ""), dollars:dollars, r:calcR(dollars,rv) };
  }
  let bestTrade = tradeMetric(closed[0]);
  let worstTrade = tradeMetric(closed[0]);
  const daily = {};
  closed.forEach(function(trade){
    const metric = tradeMetric(trade);
    if (metric.dollars > bestTrade.dollars) bestTrade = metric;
    if (metric.dollars < worstTrade.dollars) worstTrade = metric;
    if (!daily[metric.date]) daily[metric.date] = { date:metric.date, dollars:0, count:0 };
    daily[metric.date].dollars += metric.dollars;
    daily[metric.date].count++;
  });
  const days = Object.keys(daily).sort().map(function(date){
    const item = daily[date];
    return { date:item.date, dollars:item.dollars, r:calcR(item.dollars,rv), count:item.count };
  });
  let bestDay = days[0];
  let worstDay = days[0];
  days.forEach(function(day){
    if (day.dollars > bestDay.dollars) bestDay = day;
    if (day.dollars < worstDay.dollars) worstDay = day;
  });
  return { bestTrade:bestTrade, worstTrade:worstTrade, bestDay:bestDay, worstDay:worstDay };
}
function groupBy(trades, fn, rv) {
  const g = {};
  trades.forEach(function(t) { const k = fn(t); if (!g[k]) g[k] = []; g[k].push(t); });
  const result = {};
  const keys = Object.keys(g);
  for (let i = 0; i < keys.length; i++) { result[keys[i]] = calcStats(g[keys[i]], rv); }
  return result;
}

// DURATION ANALYSIS
function DurationAnalysis({trades, rv}) {
  const BUCKETS=[
    {label:"< 2min", min:0,  max:2},
    {label:"2-5min", min:2,  max:5},
    {label:"5-15min",min:5,  max:15},
    {label:"15-30min",min:15,max:30},
    {label:"30-60min",min:30,max:60},
    {label:"> 60min", min:60,max:Infinity},
  ];
  const closed=trades.filter(function(t){return getTradeResult(t)!=="Open"&&t.duration!=null;});
  if (!closed.length) return null;
  const buckets=BUCKETS.map(function(b){
    const grp=closed.filter(function(t){return t.duration>=b.min&&t.duration<b.max;});
    const wins=grp.filter(function(t){return getTradeResult(t)==="Win";}).length;
    const losses=grp.filter(function(t){return getTradeResult(t)==="Loss";}).length;
    const totalPnl=grp.reduce(function(s,t){return s+Number(t.pnl_dollars||0);},0);
    return {label:b.label,n:grp.length,wr:wins+losses?calcWinRatePercent(wins,losses):null,r:calcR(totalPnl,rv)};
  }).filter(function(b){return b.n>0;});
  if (!buckets.length) return null;
  const maxR=Math.max.apply(null,buckets.map(function(b){return Math.abs(b.r);}).concat([0.1]));
  return(
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"16px 20px",marginBottom:14}}>
      <div style={{fontSize:13,color:C.text,letterSpacing:"0.11em",textTransform:"uppercase",marginBottom:14,fontWeight:700}}>Duration Analysis</div>
      <div className="dashboard-pair" style={{gap:20}}>
        <div>
          <div style={{fontSize:12,color:C.gold,marginBottom:10,fontWeight:700}}>Win Rate per durata</div>
          {buckets.map(function(b,i){
            return(
              <div key={i} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:11,color:C.gold}}>{b.label}</span>
                  <span style={{fontSize:11,fontWeight:600,color:b.wr>=50?C.green:C.red}}>{b.wr!==null?b.wr.toFixed(0)+"%":"-"}<span style={{fontSize:9,color:C.sub,marginLeft:4}}>({b.n}t)</span></span>
                </div>
                <div style={{height:5,background:C.muted,borderRadius:3}}>
                  {b.wr!==null&&<div style={{width:b.wr+"%",height:"100%",background:b.wr>=50?C.green:C.red,borderRadius:3}}/>}
                </div>
              </div>
            );
          })}
        </div>
        <div>
          <div style={{fontSize:12,color:C.gold,marginBottom:10,fontWeight:700}}>P&L per durata</div>
          {buckets.map(function(b,i){
            const w=Math.abs(b.r)/maxR*100;
            return(
              <div key={i} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:11,color:C.gold}}>{b.label}</span>
                  <span style={{fontSize:11,fontWeight:600,color:b.r>=0?C.green:C.red}}>{fmtR(b.r)}</span>
                </div>
                <div style={{height:5,background:C.muted,borderRadius:3}}>
                  <div style={{width:w+"%",height:"100%",background:b.r>=0?C.green:C.red,borderRadius:3}}/>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function InitialStopField({trade, stopInfo, stopCol, onSave}) {
  const [value, setValue] = useState(stopInfo.price != null ? String(stopInfo.price) : "");
  const [flash, setFlash] = useState("");
  const [error, setError] = useState("");
  useEffect(function(){ setValue(stopInfo.price != null ? String(stopInfo.price) : ""); }, [trade.id, stopInfo.price]);
  async function save(){
    setFlash(""); setError("");
    try {
      await onSave(trade.id, value);
      setFlash("SALVATO");
      setTimeout(function(){ setFlash(""); }, 1400);
    } catch(e) { setError(e.message); }
  }
  return (
    <div style={{display:"flex",alignItems:"center",gap:7,marginTop:6,flexWrap:"wrap"}}>
      <span style={{fontSize:9,color:C.sub,fontWeight:700}}>Initial SL</span>
      <input type="number" step="0.25" value={value} placeholder="prezzo stop" onChange={function(e){ setValue(e.target.value); }}
        onKeyDown={function(e){ if(e.key==="Enter"){ e.preventDefault(); save(); } }}
        style={{width:105,background:C.card,border:"1px solid "+C.blue+"50",borderRadius:4,color:C.text,fontSize:10,padding:"5px 7px",fontFamily:"inherit",outline:"none"}}/>
      <button onClick={save} style={{padding:"5px 9px",background:C.blue+"12",border:"1px solid "+C.blue+"60",borderRadius:4,color:C.blue,fontSize:9,fontFamily:"inherit",cursor:"pointer",fontWeight:700,letterSpacing:"0.06em",minWidth:68}}>{flash||"SALVA SL"}</button>
      <span style={{fontSize:8,color:stopCol,border:"1px solid "+stopCol+"50",borderRadius:4,padding:"2px 5px"}}>{stopInfo.label}</span>
      {error && <span role="alert" style={{color:C.red,fontSize:10,flexBasis:"100%"}}>{error}</span>}
    </div>
  );
}

// EQUITY CURVE
function EquityCurve({trades, rv, showOnlyR}) {
  const closed = sortTradesChronologically((trades || []).filter(function(t){return getTradeResult(t)!=="Open";}));
  if (closed.length < 2) return null;
  const pts = [0]; let cum = 0;
  closed.forEach(function(t){ cum += calcR(t.pnl_dollars, rv); pts.push(cum); });
  const mn=Math.min(...pts), mx=Math.max(...pts), rng=mx-mn||1;
  const W=560,H=110,P=22,L=46,iW=W-L-P,iH=H-P*2;
  const x = function(i){ return L+(i/(pts.length-1))*iW; };
  const y = function(v){ return P+iH-((v-mn)/rng)*iH; };
  const path = pts.map(function(v,i){ return (i===0?"M":"L")+x(i).toFixed(1)+","+y(v).toFixed(1); }).join(" ");
  const fill = path+" L"+x(pts.length-1).toFixed(1)+","+(P+iH).toFixed(1)+" L"+L+","+(P+iH).toFixed(1)+" Z";
  const last=pts[pts.length-1], lc=last>=0?C.green:C.red, showZ=mn<0&&mx>0;
  let pk2=0,maxDD2=0;
  pts.forEach(function(v){if(v>pk2)pk2=v;const dd=pk2-v;if(dd>maxDD2)maxDD2=dd;});
  return (
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"16px 20px",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:12}}>
        <span style={{fontSize:12,color:C.text,letterSpacing:"0.11em",textTransform:"uppercase",fontWeight:700}}>Equity Curve</span>
        <div style={{display:"flex",gap:24}}>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:9,color:C.sub,marginBottom:2}}>Total R</div>
            <div style={{fontSize:16,fontWeight:700,color:lc}}>{fmtR(last)}</div>
            {!showOnlyR && <div style={{fontSize:11,color:lc,opacity:0.65}}>{fmtD(last*rv)}</div>}
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:9,color:C.sub,marginBottom:2}}>Max DD</div>
            <div style={{fontSize:16,fontWeight:700,color:C.red}}>{"-"+maxDD2.toFixed(2)+"R"}</div>
            {!showOnlyR && <div style={{fontSize:11,color:C.red,opacity:0.65}}>{"$"+Math.round(maxDD2*rv).toLocaleString()}</div>}
          </div>
        </div>
      </div>
      <svg viewBox={"0 0 "+W+" "+H} width="100%" style={{display:"block"}}>
        <line x1={L} y1={P+iH*0.33} x2={W-P} y2={P+iH*0.33} stroke="#14141A" strokeWidth="1"/>
        <line x1={L} y1={P+iH*0.67} x2={W-P} y2={P+iH*0.67} stroke="#14141A" strokeWidth="1"/>
        {showZ && <line x1={L} y1={y(0)} x2={W-P} y2={y(0)} stroke="#2A2A34" strokeWidth="0.75" strokeDasharray="4,3"/>}
        <path d={fill} fill={lc+"18"}/>
        <path d={path} fill="none" stroke={lc} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        {pts.map(function(v,i){ return <circle key={i} cx={x(i)} cy={y(v)} r="2" fill={i===0?"#444":v>=(pts[Math.max(0,i-1)]||0)?C.green:C.red}/>; })}
        <text x={L-4} y={P+4}    fill={C.sub} fontSize="8" textAnchor="end">{mx.toFixed(1)+"R"}</text>
        <text x={L-4} y={P+iH+4} fill={C.sub} fontSize="8" textAnchor="end">{mn.toFixed(1)+"R"}</text>
      </svg>
    </div>
  );
}

function DayCell({info, stats, rv, today, showOnlyR, onSelect, isSelected}) {
  const r       = stats ? calcR(stats.totalPnl, rv) : null;
  const isColored = stats && r !== null && Math.abs(r) >= 0.01;
  const bg      = isColored ? dayBg(r) : "transparent";
  const inM     = info.inMonth;
  const isToday = info.dateStr === today;
  const numCol  = isToday ? C.gold : (isColored && inM ? "rgba(255,255,255,0.75)" : C.sub);
  const mainCol = !inM ? C.muted  : isColored ? "#FFFFFF" : C.sub;
  const subCol  = !inM ? C.muted  : isColored ? "rgba(255,255,255,0.80)" : C.muted;
  const bdr     = isToday ? C.gold+"90" : (isColored && inM ? "transparent" : C.border);
  return (
    <div onClick={function(){if(inM&&stats)onSelect(info.dateStr);}} style={{background:inM?(isColored?bg:C.card):C.dim,border:"1px solid "+(isSelected?"#F5A020":bdr),borderRadius:6,padding:"8px 10px",minHeight:72,opacity:inM?1:0.3,cursor:inM&&stats?"pointer":"default"}}>
      <div style={{fontSize:11,color:numCol,fontWeight:isToday?700:400,marginBottom:4}}>{info.day}</div>
      {stats && inM && (
        <div>
          <div style={{fontSize:16,fontWeight:700,color:mainCol,lineHeight:1,marginBottom:3}}>{fmtR(r)}</div>
          {!showOnlyR && <div style={{fontSize:10,color:subCol,marginBottom:3}}>{fmtD(stats.totalPnl)}</div>}
          <div style={{fontSize:9,color:subCol}}>{stats.n+"t - "+stats.wr.toFixed(0)+"%W"}</div>
        </div>
      )}
    </div>
  );
}

function weekKey(week) {
  if (!week || !week.length) return "";
  return week[0].dateStr + "_" + week[week.length - 1].dateStr;
}
function toggleWeekSelection(currentKey, clickedKey) {
  return currentKey === clickedKey ? null : clickedKey;
}
function tradesForWeekRow(week, byDate) {
  const out = [];
  for (let d = 0; d < week.length; d++) {
    const dt = byDate[week[d].dateStr];
    if (dt) for (let j = 0; j < dt.length; j++) out.push(dt[j]);
  }
  return out;
}
function weekRangeLabel(week) {
  if (!week || !week.length) return "";
  const first = week[0].dateStr.split("-").map(Number);
  const last  = week[week.length - 1].dateStr.split("-").map(Number);
  const fMonth = MONTHS_IT[first[1] - 1].toUpperCase();
  const lMonth = MONTHS_IT[last[1] - 1].toUpperCase();
  if (first[1] === last[1]) return first[2] + "-" + last[2] + " " + lMonth;
  return first[2] + " " + fMonth + " - " + last[2] + " " + lMonth;
}
function productFamily(trade) {
  const root = tradeSymbolRoot(trade);
  if (root === "ES" || root === "MES") return "ES";
  if (root === "NQ" || root === "MNQ") return "NQ";
  return "OTHER";
}
function fmtPfValue(m) {
  if (!m) return "-";
  if (m.pf === Infinity) return "\u221E";
  if (!isFinite(m.pf) || isNaN(m.pf)) return "-";
  return m.pf.toFixed(2);
}
function WeekMetric({label, value, color}) {
  return (
    <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:8,padding:"12px 14px",minHeight:70}}>
      <div style={{fontSize:9,color:C.sub,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:6}}>{label}</div>
      <div style={{fontSize:17,fontWeight:700,color:color||C.text,lineHeight:1.05}}>{value}</div>
    </div>
  );
}
function WeekFamilyBox({title, trades, rv, emptyText}) {
  const m = calcStats(trades, rv);
  if (!m) return (
    <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:8,padding:"14px 16px",minHeight:128}}>
      <div style={{fontSize:10,color:C.gold,letterSpacing:"0.12em",textTransform:"uppercase",fontWeight:700,marginBottom:12}}>{title}</div>
      <div style={{fontSize:12,color:C.sub}}>{emptyText}</div>
    </div>
  );
  const avgR = m.n ? m.totalR / m.n : 0;
  return (
    <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:8,padding:"14px 16px"}}>
      <div style={{fontSize:10,color:C.gold,letterSpacing:"0.12em",textTransform:"uppercase",fontWeight:700,marginBottom:12}}>{title}</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>
        <WeekMetric label="Trade" value={String(m.n)} />
        <WeekMetric label="W / L / BE" value={m.w+" / "+m.l+" / "+m.be} color={C.sub} />
        <WeekMetric label="Win Rate" value={m.wr.toFixed(1)+"%"} color={m.wr>=50?C.green:C.red} />
        <WeekMetric label="Net R" value={fmtR(m.totalR)} color={m.totalR>=0?C.green:C.red} />
        <WeekMetric label="PF" value={fmtPfValue(m)} color={m.pf>=1?C.green:C.red} />
        <WeekMetric label="Avg R / Trade" value={fmtR(avgR)} color={avgR>=0?C.green:C.red} />
      </div>
    </div>
  );
}
function WeekStatsPanel({week, trades, rv}) {
  const m = calcStats(trades, rv);

  const nqTrades = trades.filter(function(t){ return productFamily(t) === "NQ"; });

    <div data-testid="week-stats-panel" style={{background:C.card,border:"1px solid "+C.gold+"45",borderRadius:10,padding:"16px 18px",marginTop:12}}>

        <div>
          <div style={{fontSize:9,color:C.sub,letterSpacing:"0.13em",textTransform:"uppercase",marginBottom:4}}>SETTIMANA</div>

        </div>
        <div style={{fontSize:11,color:C.gold,border:"1px solid "+C.gold+"45",borderRadius:4,padding:"5px 9px",whiteSpace:"nowrap"}}>{"1R = "+rv+" USD"}</div>
      </div>
      {m ? (
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:10,marginBottom:12}}>
          <WeekMetric label="Net R" value={fmtR(m.totalR)} color={m.totalR>=0?C.green:C.red} />
          <WeekMetric label="Trade" value={String(m.n)} />

          <WeekMetric label="PF" value={fmtPfValue(m)} color={m.pf>=1?C.green:C.red} />
          <WeekMetric label="Avg R / Trade" value={fmtR(avgR)} color={avgR>=0?C.green:C.red} />

      )}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:12}}>
        <WeekFamilyBox title="ES / MES" trades={esTrades} rv={rv} emptyText="Nessun trade ES/MES" />
        <WeekFamilyBox title="NQ / MNQ" trades={nqTrades} rv={rv} emptyText="Nessun trade NQ/MNQ" />

}

// WEEK CELL
function WeekCell({weekTrades, rv, showOnlyR, selected, onClick}) {
  weekTrades = weekTrades || [];
  const closed   = weekTrades.filter(function(t){ return getTradeResult(t) !== "Open"; });
  const totalPnl = closed.reduce(function(s,t){ return s+Number(t.pnl_dollars||0); }, 0);
  const r   = calcR(totalPnl, rv);
  const wins = closed.filter(function(t){ return getTradeResult(t) === "Win"; }).length;
  const losses = closed.filter(function(t){ return getTradeResult(t) === "Loss"; }).length;
  const wr  = calcWinRatePercent(wins, losses);
  const isColored = closed.length && Math.abs(r) >= 0.01;
  const bg  = isColored ? dayBg(r) : C.card;
  const mainCol = isColored ? "#FFFFFF" : C.sub;
  const subCol  = isColored ? "rgba(255,255,255,0.80)" : C.muted;
  return (
    <div role="button" tabIndex={0} aria-pressed={selected?"true":"false"} onClick={onClick} onKeyDown={function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();onClick();}}} style={{background:bg,border:"1px solid "+(selected?C.gold+"90":(isColored?"transparent":C.border)),borderRadius:6,padding:"8px 10px",minHeight:72,cursor:"pointer",boxShadow:selected?"0 0 0 1px "+C.gold+"35 inset":"none"}}>
      <div style={{fontSize:9,color:isColored?"rgba(255,255,255,0.65)":C.sub,marginBottom:4,letterSpacing:"0.08em",fontWeight:600}}>WEEK</div>
      {closed.length ? (
        <div>
          <div style={{fontSize:14,fontWeight:700,color:mainCol,lineHeight:1,marginBottom:2}}>{fmtR(r)}</div>
          {!showOnlyR && <div style={{fontSize:10,color:subCol,marginBottom:2}}>{fmtD(totalPnl)}</div>}
          <div style={{fontSize:9,color:subCol}}>{closed.length+"t - "+wr.toFixed(0)+"%W"}</div>
        </div>
      ) : (
        <div style={{fontSize:14,fontWeight:700,color:C.muted,lineHeight:1,marginTop:13}}>{"-"}</div>
      )}
    </div>
  );
}

// CALENDARIO VIEW
function CalendarioView({trades, rv, onImport, onExport, onTWImport, ohlcMeta, showOnlyR, onToggleR, onUpdateInitialStop, initialStopDate}) {
  const now = new Date();
  const focusParts = initialStopDate ? initialStopDate.split("-").map(Number) : null;
  const [year,  setYear]  = useState(focusParts ? focusParts[0] : now.getFullYear());
  const [month, setMonth] = useState(focusParts ? focusParts[1] - 1 : now.getMonth());
  const [selectedDate, setSelectedDate] = useState(initialStopDate || null);
  const [selectedWeekKey, setSelectedWeekKey] = useState(null);
  useEffect(function(){
    if (!initialStopDate) return;
    const parts = initialStopDate.split("-").map(Number);
    setYear(parts[0]); setMonth(parts[1] - 1); setSelectedDate(initialStopDate);
    const timer = setTimeout(function(){
      const editor = document.getElementById("initial-sl-editor");
      if (editor) editor.scrollIntoView({behavior:"smooth",block:"start"});
    }, 180);
    return function(){ clearTimeout(timer); };
  }, [initialStopDate]);
  const today = now.toISOString().slice(0, 10);
  const byDate = {};
  trades.forEach(function(t){ if (!byDate[t.date]) byDate[t.date]=[]; byDate[t.date].push(t); });
  function dayStats(ds) {
    const dt = byDate[ds]; if (!dt || !dt.length) return null;
    const closed = dt.filter(function(t){ return getTradeResult(t) !== "Open"; }); if (!closed.length) return null;
    const totalPnl = closed.reduce(function(s,t){ return s+Number(t.pnl_dollars||0); }, 0);
    const wins = closed.filter(function(t){ return getTradeResult(t) === "Win"; }).length;
    const losses = closed.filter(function(t){ return getTradeResult(t) === "Loss"; }).length;
    return { n: closed.length, totalPnl: totalPnl, wr: calcWinRatePercent(wins, losses) };
  }
  const weeks = getCalendarWeeks(year, month);
  const weekRows = weeks.map(function(week){
    const k = weekKey(week);
    return { key: k, week: week, trades: tradesForWeekRow(week, byDate) };
  });
  const selectedWeek = weekRows.filter(function(w){ return w.key === selectedWeekKey; })[0] || null;
  const monthTrades = trades.filter(function(t){
    const p = t.date.split("-").map(Number); return p[0]===year && p[1]-1===month;
  });
  const ms = calcStats(monthTrades, rv);
  function prevM(){ setSelectedWeekKey(null); setSelectedDate(null); if (month===0){setYear(function(y){return y-1;}); setMonth(11);} else setMonth(function(m){return m-1;}); }
  function nextM(){ setSelectedWeekKey(null); setSelectedDate(null); if (month===11){setYear(function(y){return y+1;}); setMonth(0);} else setMonth(function(m){return m+1;}); }
  const monthSummary = [
    {label:"WIN RATE", val:ms?ms.wr.toFixed(0)+"%":"", col:ms?(ms.wr>=50?C.green:C.red):C.sub},
    {label:"TRADE",    val:ms?String(ms.n):"",          col:C.text},
    {label:"W/L/BE",   val:ms?(ms.w+" / "+ms.l+" / "+ms.be):"", col:C.sub},
  ];
  return (
    <div>
      <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"18px 20px",marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:ms?16:0}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <button onClick={prevM} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:15,padding:"4px 12px",cursor:"pointer",fontFamily:"inherit"}}>{"<"}</button>
            <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:700,color:C.text,letterSpacing:"0.08em"}}>{MONTHS_IT[month].toUpperCase()+" "+year}</span>
            <button onClick={nextM} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:15,padding:"4px 12px",cursor:"pointer",fontFamily:"inherit"}}>{">"}</button>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <button onClick={onToggleR} style={{padding:"6px 12px",background:showOnlyR?C.gold+"20":"transparent",border:"1px solid "+(showOnlyR?C.gold:C.border),borderRadius:20,color:showOnlyR?C.gold:C.sub,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",fontWeight:showOnlyR?700:400}}>
              {showOnlyR?"R":"R / $"}
            </button>
            {ohlcMeta && <span style={{fontSize:10,color:C.green,border:"1px solid "+C.green+"30",borderRadius:4,padding:"3px 8px"}}>{"OHLC "+ohlcMeta.days+"gg"}</span>}
            <button onClick={onTWImport} style={{padding:"7px 14px",background:"transparent",border:"1px solid "+C.blue+"50",borderRadius:4,color:C.blue,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase"}}>{"TW IMPORT"}</button>
            <button onClick={onImport}   style={{padding:"7px 14px",background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase"}}>{"IMPORT"}</button>
            <button onClick={onExport}   style={{padding:"7px 14px",background:"transparent",border:"1px solid "+C.gold+"50",borderRadius:4,color:C.gold,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase"}}>{"EXPORT"}</button>
          </div>
        </div>
        {ms && (
          <div style={{display:"flex",gap:24,paddingTop:12,borderTop:"0.5px solid "+C.muted}}>
            <div>
              <div style={{fontSize:9,color:C.sub,marginBottom:2,letterSpacing:"0.1em"}}>MESE</div>
              <div style={{fontSize:18,fontWeight:700,color:ms.totalR>=0?C.green:C.red}}>{fmtR(ms.totalR)}</div>
              {!showOnlyR && <div style={{fontSize:11,color:ms.totalR>=0?C.green:C.red,opacity:0.65}}>{fmtD(ms.totalD)}</div>}
            </div>
            {monthSummary.map(function(item){ return (
              <div key={item.label} style={{borderLeft:"0.5px solid "+C.muted,paddingLeft:24}}>
                <div style={{fontSize:9,color:C.sub,marginBottom:2,letterSpacing:"0.1em"}}>{item.label}</div>
                <div style={{fontSize:16,fontWeight:600,color:item.col}}>{item.val}</div>
              </div>
            ); })}
          </div>
        )}
      </div>
      <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"16px"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr) 80px",gap:6,marginBottom:8}}>
          {DAYS_IT.map(function(d){ return <div key={d} style={{textAlign:"center",fontSize:10,color:C.sub,letterSpacing:"0.1em",padding:"3px 0"}}>{d}</div>; })}
          <div style={{textAlign:"center",fontSize:9,color:C.muted,letterSpacing:"0.08em",padding:"3px 0"}}>WEEK</div>
        </div>
        {weekRows.map(function(row, wi){
          return (
            <div key={wi} style={{display:"grid",gridTemplateColumns:"repeat(5,1fr) 80px",gap:6,marginBottom:6}}>
              {row.week.map(function(info, di){ return <DayCell key={di} info={info} stats={dayStats(info.dateStr)} rv={rv} today={today} showOnlyR={showOnlyR} onSelect={function(d){setSelectedDate(selectedDate===d?null:d);}} isSelected={selectedDate===info.dateStr}/>; })}
              <WeekCell weekTrades={row.trades} rv={rv} showOnlyR={showOnlyR} selected={selectedWeekKey===row.key} onClick={function(){setSelectedWeekKey(function(k){return toggleWeekSelection(k,row.key);});}}/>
            </div>
          );
        })}
      </div>
      {selectedWeek && <WeekStatsPanel week={selectedWeek.week} trades={selectedWeek.trades} rv={rv}/>}
      {selectedDate && (
        <DayTradeList trades={byDate[selectedDate]||[]} rv={rv} date={selectedDate} onUpdateInitialStop={onUpdateInitialStop}/>
      )}
    </div>
  );
}

// DASHBOARD

  const byDow    = groupBy(trades, function(t){ return getDow(t.date); }, rv);
  const bySess   = groupBy(trades, function(t){ return getSession(t.entry_time||""); }, rv);
  const byDir    = groupBy(trades, function(t){ return t.direction||"Buy"; }, rv);
  const byPart   = groupBy(trades, function(t){ return t.partial?"Partial":"Full Hold"; }, rv);
  const byAsset  = groupBy(trades, function(t){ return productFamily(t); }, rv);
  const rfC  = m.rf>=3?C.green:m.rf>=1.5?C.gold:C.red;
  const evC  = m.ev>=0?C.green:C.red;

    const details = [];
    if (!showOnlyR) details.push(fmtD(item.dollars));
    details.push(formatExecutionDate(item.date));
    if (item.trade && item.trade.product) details.push(item.trade.product);
    if (item.trade && item.trade.entry_time) details.push(item.trade.entry_time);
    return details.join(" · ");
  }
  function dayExtremeSub(item) {
    const details = [];
    if (!showOnlyR) details.push(fmtD(item.dollars));

    return details.join(" · ");

          {showOnlyR?"R":"R / $"}

        <MetricCard label="Win Rate"      value={m.wr.toFixed(1)+"%"}                                          color={m.wr>=50?C.green:C.red}/>
        <MetricCard label="Profit Factor" value={isFinite(m.pf)?m.pf.toFixed(2):"\u221E"}                    color={m.pf>=1?C.green:C.red}/>
        <MetricCard label="Total R"       value={fmtR(m.totalR)}                         sub={showOnlyR?null:fmtD(m.totalD)}  color={totC}/>
      </div>
      <div className="dashboard-metrics" style={{gap:10,marginBottom:10}}>
        <MetricCard label="Avg Win"           value={"+"+m.avgW.toFixed(2)+"R"} sub={showOnlyR?null:fmtD(m.avgW*rv)} color={C.green}/>
        <MetricCard label="Avg Loss"          value={m.avgL.toFixed(2)+"R"}     sub={showOnlyR?null:fmtD(m.avgL*rv)} color={C.red}/>

        <MetricCard label="Max Streak Win"  value={String(m.maxConsecW)} sub="consecutivi" color={C.green}/>

const CHAMPION_MINDSET_KEY = "jnl:v2:champion_mindset";
const JOURNAL_MOTTO = "1% BETTER EVERY DAY.";
const CHAMPION_QUOTES = [
  {id:"tenacity", text:"VICTORY BELONGS TO THE MOST TENACIOUS.", author:"Roland-Garros"},
  {id:"pressure", text:"PRESSURE IS A PRIVILEGE.", author:"Billie Jean King"},
  {id:"recovery", text:"CHAMPIONS ARE DEFINED BY HOW THEY RECOVER.", author:"Serena Williams"},
  {id:"rest", text:"REST AT THE END, NOT IN THE MIDDLE.", author:"Kobe Bryant"},
  {id:"finish", text:"FIRST, YOU HAVE TO FINISH.", author:"Michael Schumacher"},
  {id:"bullish_life", text:"NO MATTER WHAT HAPPENS, WE ARE BULLISH ON LIFE.", author:"Noemi"},
  {id:"winner_never_quits", text:"A QUITTER NEVER WINS, AND A WINNER NEVER QUITS.", author:"Napoleon Hill"},
];
function mindsetToday(now) {
  const d = now || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function mindsetDayNumber(date) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
  const time = Date.parse(date + "T00:00:00Z");
  if (!Number.isFinite(time) || new Date(time).toISOString().slice(0,10) !== date) return null;
  return time / 86400000;
}
function mindsetDateFromDay(day) {
  return new Date(day * 86400000).toISOString().slice(0,10);
}
function mindsetShiftMonth(date, delta) {
  const d = new Date(date + "T00:00:00Z");
  const day = d.getUTCDate();
  d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + delta);
  const end = new Date(d); end.setUTCMonth(end.getUTCMonth()+1); end.setUTCDate(0);
  d.setUTCDate(Math.min(day,end.getUTCDate()));
  return d.toISOString().slice(0,10);
}
function mindsetDateLabel(date) {
  const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  return date.slice(8,10) + " " + months[Number(date.slice(5,7))-1];
}
function parseMindsetEntries(raw) {
  const entries = raw == null ? {} : JSON.parse(raw);
  if (!entries || typeof entries !== "object" || Array.isArray(entries)) throw new Error("Archivio Champion Mindset non valido.");
  Object.keys(entries).forEach(function(date){
    if (mindsetDayNumber(date) == null || !CHAMPION_QUOTES.some(function(q){return q.id === entries[date];})) {
      throw new Error("Archivio Champion Mindset non valido. Nessuna associazione e stata modificata.");
    }
  });
  return entries;
}
async function saveMindsetQuote(date, quoteId) {
  if (mindsetDayNumber(date) == null || !CHAMPION_QUOTES.some(function(q){return q.id === quoteId;})) throw new Error("Data o frase non valida.");
  const stored = await storage.get(CHAMPION_MINDSET_KEY);
  const entries = parseMindsetEntries(stored ? stored.value : null);
  if (entries[date] === quoteId) return entries;
  const next = {...entries, [date]:quoteId};
  await storage.set(CHAMPION_MINDSET_KEY, JSON.stringify(next));
  return next;
}
function MindsetDateWheel({value, onChange}) {
  const [anchor, setAnchor] = useState(value);
  const scroller = useRef(null);
  const scrollTimer = useRef(null);
  const scrollSelection = useRef(null);
  const positionedAnchor = useRef(null);
  const firstDay = mindsetDayNumber(anchor) - 365;
  const rowHeight = 48;
  useEffect(function(){
    const element = scroller.current;
    if (!element) return;
    const index = mindsetDayNumber(value) - firstDay;
    if (index < 30 || index > 700) { setAnchor(value); return; }
    if (scrollSelection.current === value && positionedAnchor.current === anchor) return;
    clearTimeout(scrollTimer.current);
    positionedAnchor.current = anchor;
    scrollSelection.current = value;
    element.scrollTop = index * rowHeight;
  }, [value, anchor]);
  useEffect(function(){ return function(){clearTimeout(scrollTimer.current);}; }, []);
  function choose(date) {
    clearTimeout(scrollTimer.current);
    scrollSelection.current = null;
    const index = mindsetDayNumber(date) - firstDay;
    if (index < 30 || index > 700) setAnchor(date);
    else if (scroller.current) scroller.current.scrollTop = index * rowHeight;
    onChange(date);
  }
  function handleScroll(event) {
    const element = event.currentTarget;
    clearTimeout(scrollTimer.current);
    scrollTimer.current = setTimeout(function(){
      const index = Math.max(0,Math.min(730,Math.round(element.scrollTop / rowHeight)));
      const date = mindsetDateFromDay(firstDay + index);
      scrollSelection.current = date;
      // Recenter the rendered window at its edges, retaining access to older years.
      if (index < 30 || index > 700) setAnchor(date);
      else element.scrollTop = index * rowHeight;
      if (date !== value) onChange(date);
    }, 100);
  }
  function handleKey(event) {
    let date = null;
    if (event.key === "ArrowUp") date = mindsetDateFromDay(mindsetDayNumber(value)-1);
    if (event.key === "ArrowDown") date = mindsetDateFromDay(mindsetDayNumber(value)+1);
    if (event.key === "PageUp") date = mindsetShiftMonth(value,event.shiftKey?-12:-1);
    if (event.key === "PageDown") date = mindsetShiftMonth(value,event.shiftKey?12:1);
    if (event.key === "Home") date = mindsetToday();
    if (date) { event.preventDefault(); choose(date); }
  }
  const dates = Array.from({length:731},function(_,i){return mindsetDateFromDay(firstDay+i);});
  return (
    <div className="mindset-date-picker">
      <div className="mindset-wheel" ref={scroller} role="listbox" tabIndex={0} aria-label="Data Champion Mindset"
        aria-activedescendant={"mindset-date-"+value} onScroll={handleScroll} onKeyDown={handleKey}>
        <div className="mindset-wheel-track">
          {dates.map(function(date){
            const selected = date === value;
            return <button key={date} id={"mindset-date-"+date} type="button" className="mindset-date" role="option"
              aria-selected={selected} aria-label={mindsetDateLabel(date)+" "+date.slice(0,4)} tabIndex={-1}
              onClick={function(){choose(date);}}>
              <span>{mindsetDateLabel(date)}</span>
              {selected && <span className="mindset-date-year">{date.slice(0,4)}</span>}
            </button>;
          })}
        </div>
      </div>
    </div>
  );
}
function ChampionMindsetView() {
  const [date, setDate] = useState(mindsetToday);
  const [entries, setEntries] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const busy = useRef(false);
  const active = useRef(true);
  useEffect(function(){
    active.current = true;
    (async function(){
      try {
        const stored = await storage.get(CHAMPION_MINDSET_KEY);
        const next = parseMindsetEntries(stored ? stored.value : null);
        if (active.current) { setEntries(next); setLoaded(true); }
      } catch(e) { if (active.current) setError("Lettura Champion Mindset non riuscita. Nessun dato e stato sovrascritto."); }
    })();
    return function(){active.current = false;};
  }, []);
  async function chooseQuote(quoteId) {
    if (!loaded || busy.current) return;
    busy.current = true; setSaving(true); setError("");
    try {
      const next = await saveMindsetQuote(date,quoteId);
      if (active.current) setEntries(next);
    } catch(e) { if (active.current) setError("Non salvato per " + mindsetDateLabel(date) + " " + date.slice(0,4) + ". " + e.message); }
    finally { busy.current = false; if (active.current) setSaving(false); }
  }
  return (
    <section aria-labelledby="champion-mindset-title">
      <h1 id="champion-mindset-title" className="mindset-title">CHAMPION MINDSET</h1>
      {error && <div role="alert" className="mindset-feedback">{error}</div>}
      <div className="mindset-layout">
        <div className="mindset-quotes" role="radiogroup" aria-label={"Frase del "+date} aria-busy={!loaded || saving}>
          {CHAMPION_QUOTES.map(function(quote){
            const selected = entries[date] === quote.id;
            return <label key={quote.id} className={"mindset-statement"+(selected?" is-selected":"")}>
              <input type="radio" name="champion-quote" value={quote.id} checked={selected} disabled={!loaded || saving}
                onChange={function(){chooseQuote(quote.id);}}/>
              <span className="mindset-quote-text">{quote.text}</span>
              <span className="mindset-author">{"\u2014 "+quote.author}</span>
            </label>;
          })}
        </div>
        <MindsetDateWheel value={date} onChange={setDate}/>
      </div>
    </section>
  );
}
