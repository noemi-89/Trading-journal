function getFascia(t) {
  if (!t) return "Altro";
  const parts = t.split(":"); const h = Number(parts[0]); const m = Number(parts[1]);
  const mins = h * 60 + m;
  if (mins >= 570 && mins <= 630) return "Gold Zone";
  if (mins > 630  && mins <= 660) return "Dead Zone";
  if (mins > 660  && mins <= 735) return "Second Window";
  if (mins > 735  && mins < 900)  return "Midday";
  if (mins >= 900)                 return "Power Hour";
  return "Altro";
}
function getSession(t) {
  if (!t) return "AM";
  const parts = t.split(":"); const h = Number(parts[0]); const m = Number(parts[1]);
  const mins = h * 60 + m;
  if (mins < 570) return "Pre Market";
  if (mins < 720) return "AM";
  if (mins < 900) return "PM";
  return "Power Hour";
}
function calcR(pnl, rv)  { return pnl / rv; }
function fmtR(r)         { if (r == null || isNaN(r)) return "\u2014"; return (r >= 0 ? "+" : "") + r.toFixed(2) + "R"; }
function fmtD(d)         { if (d == null || isNaN(d)) return "\u2014"; return (d >= 0 ? "+" : "-") + "$" + Math.abs(Math.round(d)).toLocaleString("en-US"); }
function fmtDur(m)       { if (m == null) return "\u2014"; if (m < 60) return Math.round(m) + "m"; return Math.floor(m / 60) + "h " + Math.round(m % 60) + "m"; }

function dayBg(r) {
  if (r == null || isNaN(r) || Math.abs(r) < 0.01) return "transparent";
  const i = Math.min(Math.abs(r) / 4, 1);
  if (r > 0) return "rgba(30,191,106," + (0.12 + 0.48 * i).toFixed(2) + ")";
  return "rgba(232,69,69," + (0.12 + 0.48 * i).toFixed(2) + ")";
}
function getCalendarWeeks(year, month) {
  const first = new Date(year, month, 1);
  const last  = new Date(year, month + 1, 0);
  const dow   = first.getDay();
  const back  = dow === 0 ? 6 : dow - 1;
  const start = new Date(first);
  start.setDate(start.getDate() - back);
  const weeks = [];
  const cur = new Date(start);
  while (weeks.length < 7) {
    const week = [];
    for (let d = 0; d < 5; d++) {
      const dt = new Date(cur);
      dt.setDate(dt.getDate() + d);
      const ds = dt.toISOString().slice(0, 10);
      week.push({ day: dt.getDate(), dateStr: ds, inMonth: dt.getMonth() === month && dt.getFullYear() === year });
    }
    weeks.push(week);
    cur.setDate(cur.getDate() + 7);
    if (cur > last && weeks.length >= 1) break;
  }
  return weeks.filter(function(w) { return w.some(function(d) { return d.inMonth; }); });
}

// ─── TRADOVATE PARSER ─────────────────────────────────────────────────────────
function parseCSVLine(line) {
  const result = [];
  let current = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === "," && !inQuotes) { result.push(current.trim()); current = ""; }
    else { current += ch; }
  }
  result.push(current.trim());
  return result;
}
function getNthSunday(year, month, n) {
  const d = new Date(year, month, 1);
  const daysToFirstSun = d.getDay() === 0 ? 0 : 7 - d.getDay();
  return new Date(year, month, 1 + daysToFirstSun + (n - 1) * 7);
}
function getLastSunday(year, month) {
  const lastDay = new Date(year, month + 1, 0);
  return new Date(year, month, lastDay.getDate() - lastDay.getDay());
}
function getETOffset(dateStr) {
  const p = dateStr.split("/");
  const date = new Date(parseInt(p[2]), parseInt(p[0]) - 1, parseInt(p[1]));
  const y = date.getFullYear();
  const usStart = getNthSunday(y, 2, 2);
  const usEnd   = getNthSunday(y, 10, 1);
  const euStart = getLastSunday(y, 2);
  const euEnd   = getLastSunday(y, 9);
  const usDst = date >= usStart && date < usEnd;
  const euDst = date >= euStart && date < euEnd;
  if (usDst && euDst)    return 6;
  if (!usDst && !euDst)  return 6;
  if (usDst && !euDst)   return 5;
  return 7;
}
function itToET(dateStr, timeStr) {
  const offset = getETOffset(dateStr);
  const p = dateStr.split("/");
  const t = timeStr.split(":");
  const dt = new Date(parseInt(p[2]), parseInt(p[0]) - 1, parseInt(p[1]), parseInt(t[0]), parseInt(t[1]), parseInt(t[2] || 0));
  dt.setHours(dt.getHours() - offset);
  return {
    date: dt.toISOString().slice(0, 10),
    time: String(dt.getHours()).padStart(2, "0") + ":" + String(dt.getMinutes()).padStart(2, "0"),
  };
}
function parseTradovateCSV(text) {
  const content = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  const lines = content.trim().split("\n").filter(function(l) { return l.trim(); });
  if (lines.length < 2) return { trades: [], errors: ["File vuoto."] };
  const header = parseCSVLine(lines[0]);
  if (header.indexOf("Bought Timestamp") === -1) {
    return { trades: [], errors: ["Formato non riconosciuto. Usa Position History, NON Orders."] };
  }
  const trades = [];
  const errors = [];
  const posIdCount = {};
  // Prima passata: conta quante righe per ogni Position ID (per rilevare partial)
  for (let i = 1; i < lines.length; i++) {
    try {
      const row = parseCSVLine(lines[i]);
      const posId = row[0] || "";
      if (posId) posIdCount[posId] = (posIdCount[posId] || 0) + 1;
    } catch(e) {}
  }
  // Seconda passata: parse completo
  for (let i = 1; i < lines.length; i++) {
    try {
      const row = parseCSVLine(lines[i]);
      const obj = {};
      for (let j = 0; j < header.length; j++) { obj[header[j]] = row[j] || ""; }
      const boughtTs = obj["Bought Timestamp"];
      const soldTs   = obj["Sold Timestamp"];
      if (!boughtTs || !soldTs) continue;
      const bParts = boughtTs.split(" "); const bDate = bParts[0]; const bTime = bParts[1];
      const sParts = soldTs.split(" ");   const sDate = sParts[0]; const sTime = sParts[1];
      const bp = bDate.split("/"); const bt = bTime.split(":");
      const sp = sDate.split("/"); const st = sTime.split(":");
      const bDt = new Date(parseInt(bp[2]), parseInt(bp[0]) - 1, parseInt(bp[1]), parseInt(bt[0]), parseInt(bt[1]), parseInt(bt[2] || 0));
      const sDt = new Date(parseInt(sp[2]), parseInt(sp[0]) - 1, parseInt(sp[1]), parseInt(st[0]), parseInt(st[1]), parseInt(st[2] || 0));
      const isBuy = bDt < sDt;
      const entryDate = isBuy ? bDate : sDate; const entryTime = isBuy ? bTime : sTime;
      const exitDate  = isBuy ? sDate : bDate; const exitTime  = isBuy ? sTime : bTime;
      const entryET = itToET(entryDate, entryTime);
      const exitET  = itToET(exitDate,  exitTime);
      const buyPrice  = parseFloat(obj["Buy Price"]);
      const sellPrice = parseFloat(obj["Sell Price"]);
      const pnl = parseFloat(obj["P/L"].replace(/,/g, ""));
      const duration = Math.round(Math.abs(sDt - bDt) / 60000);
      const result = pnl > 0 ? "Win" : pnl < 0 ? "Loss" : "BE";
      const posId  = obj["Position ID"] || "";
      const pairId = obj["Pair ID"] || "";
      const isPartial = posIdCount[posId] > 1;
      trades.push({
        id:          (posId && pairId) ? (posId + "_" + pairId) : ("tv_" + Date.now() + "_" + i),
        date:        entryET.date,
        entry_time:  entryET.time,
        exit_time:   exitET.time,
        duration:    duration,
        direction:   isBuy ? "Buy" : "Sell",
        entry_price: isBuy ? buyPrice : sellPrice,
        exit_price:  isBuy ? sellPrice : buyPrice,
        pnl_dollars: isNaN(pnl) ? 0 : pnl,
        result:      result,
        product:     obj["Product"] || "ES",
        notes:       "",
        partial:     isPartial,
      });
    } catch(e) { errors.push("Riga " + (i + 1) + ": " + e.message); }
  }
  return { trades: trades, errors: errors };
}

// ─── MAE / MFE ────────────────────────────────────────────────────────────────
function parseTWCsv(text) {
  const lines = text.trim().split("\n").filter(function(l) { return l.trim(); });
  if (lines.length < 2) return [];
  const result = [];
  for (let i = 1; i < lines.length; i++) {
    const p = lines[i].split(",");
    if (p.length < 4) continue;
    const time = parseInt(p[0]); const high = parseFloat(p[2]); const low = parseFloat(p[3]);
    if (!isNaN(time) && !isNaN(high) && !isNaN(low)) result.push({ time: time, high: high, low: low });
  }
  return result;
}
function unixToETDate(ts) {
  const etMs = ts * 1000 - 4 * 3600 * 1000;
  return new Date(etMs).toISOString().slice(0, 10);
}
function etToUnix(dateStr, timeStr) {
  const dp = dateStr.split("-"); const tp = timeStr.split(":");
  return Math.floor(new Date(Date.UTC(parseInt(dp[0]), parseInt(dp[1]) - 1, parseInt(dp[2]), parseInt(tp[0]) + 4, parseInt(tp[1]), 0)).getTime() / 1000);
}
function calcMaeMfe(trade, ohlcData) {
  if (!trade.entry_price || !trade.exit_price || !trade.entry_time || !trade.exit_time || !ohlcData || !ohlcData.length) return null;
  const entryUnix = etToUnix(trade.date, trade.entry_time);
  const exitUnix  = etToUnix(trade.date, trade.exit_time);
  const candles = ohlcData.filter(function(c) { return c.time >= entryUnix - 300 && c.time <= exitUnix; });
  if (!candles.length) return null;
  let maxHigh = -Infinity; let minLow = Infinity;
  for (let i = 0; i < candles.length; i++) {
    if (candles[i].high > maxHigh) maxHigh = candles[i].high;
    if (candles[i].low  < minLow)  minLow  = candles[i].low;
  }
  const ep = parseFloat(trade.entry_price); const xp = parseFloat(trade.exit_price);
  let mae; let mfe; let pnlPts;
  if (trade.direction === "Buy") { mae = Math.max(0, ep - minLow); mfe = Math.max(0, maxHigh - ep); pnlPts = xp - ep; }
  else                           { mae = Math.max(0, maxHigh - ep); mfe = Math.max(0, ep - minLow); pnlPts = ep - xp; }
  const efficiency = mfe > 0.01 ? Math.max(0, Math.min(100, (pnlPts / mfe) * 100)) : 0;
  return { mae: mae, mfe: mfe, efficiency: efficiency };
}
function calcMaeMfeStats(trades, ohlcData) {
  if (!ohlcData || !ohlcData.length) return null;
  const results = [];
  for (let i = 0; i < trades.length; i++) {
    const t = trades[i];
    if (t.result !== "Open" && t.entry_price && t.exit_price) {
      const r = calcMaeMfe(t, ohlcData);
      if (r) results.push(r);
    }
  }
  if (!results.length) return null;
  const n = results.length;
  let sumMae = 0; let sumMfe = 0; let sumEff = 0; let cntEff = 0;
  for (let i = 0; i < results.length; i++) {
    sumMae += results[i].mae;
    sumMfe += results[i].mfe;
    if (results[i].mfe > 0.01) { sumEff += results[i].efficiency; cntEff++; }
  }
  return { avgMae: sumMae / n, avgMfe: sumMfe / n, avgEff: cntEff ? sumEff / cntEff : 0, n: n };
}

// ─── STATS ENGINE ─────────────────────────────────────────────────────────────
function calcStats(trades, rv) {
  const closed = trades.filter(function(t) { return t.result !== "Open"; });
  if (!closed.length) return null;
  const wins   = closed.filter(function(t) { return t.result === "Win"; });
  const losses = closed.filter(function(t) { return t.result === "Loss"; });
  const bes    = closed.filter(function(t) { return t.result === "BE"; });
  const wr = wins.length / closed.length;
  const wR = wins.map(function(t)   { return calcR(t.pnl_dollars, rv); });
  const lR = losses.map(function(t) { return calcR(t.pnl_dollars, rv); });
  const avgW = wR.length ? wR.reduce(function(a,b){return a+b;},0) / wR.length : 0;
  const avgL = lR.length ? lR.reduce(function(a,b){return a+b;},0) / lR.length : 0;
  const ev   = wr * avgW + (1 - wr) * avgL;
  const gw   = wR.reduce(function(a,b){return a+b;},0);
  const gl   = Math.abs(lR.reduce(function(a,b){return a+b;},0));
  const pf   = gl ? gw / gl : gw > 0 ? 99 : 0;
  const totalR = closed.reduce(function(s,t){return s+calcR(t.pnl_dollars,rv);},0);
  const totalD = closed.reduce(function(s,t){return s+(t.pnl_dollars||0);},0);
  let mxW=0,mxL=0,cW=0,cL=0;
  closed.forEach(function(t){if(t.result==="Win"){cW++;cL=0;mxW=Math.max(mxW,cW);}else if(t.result==="Loss"){cL++;cW=0;mxL=Math.max(mxL,cL);}else{cW=0;cL=0;}});
  const rev=[...closed].reverse(); let pk=0,maxDD=0,cum=0;
  rev.forEach(function(t){cum+=calcR(t.pnl_dollars,rv);if(cum>pk)pk=cum;const dd=pk-cum;if(dd>maxDD)maxDD=dd;});
  const wDur = wins.filter(function(t){return t.duration!=null;});
  const lDur = losses.filter(function(t){return t.duration!=null;});
  return {
    n:closed.length, w:wins.length, l:losses.length, be:bes.length,
    wr:wr*100, avgW:avgW, avgL:avgL, ev:ev, pf:pf, totalR:totalR, totalD:totalD,
    maxConsecW:mxW, maxConsecL:mxL, maxDD:maxDD,
    rf: maxDD > 0 ? totalR / maxDD : totalR > 0 ? Infinity : 0,
    avgDurW: wDur.length ? wDur.reduce(function(s,t){return s+t.duration;},0)/wDur.length : null,
    avgDurL: lDur.length ? lDur.reduce(function(s,t){return s+t.duration;},0)/lDur.length : null,
  };
}
function groupBy(trades, fn, rv) {
  const g = {};
  trades.forEach(function(t) { const k = fn(t); if (!g[k]) g[k] = []; g[k].push(t); });
  const result = {};
  const keys = Object.keys(g);
  for (let i = 0; i < keys.length; i++) { result[keys[i]] = calcStats(g[keys[i]], rv); }
  return result;
}

function EquityCurve({trades, rv}) {
  const closed = [...trades].filter(function(t){return t.result!=="Open";}).reverse();
  if (closed.length < 2) return null;
  const pts = [0]; let cum = 0;
  closed.forEach(function(t){ cum += calcR(t.pnl_dollars, rv); pts.push(parseFloat(cum.toFixed(2))); });
  const mn=Math.min(...pts), mx=Math.max(...pts), rng=mx-mn||1;
  const W=560,H=110,P=22,iW=W-P*2,iH=H-P*2;
  const x = function(i){ return P+(i/(pts.length-1))*iW; };
  const y = function(v){ return P+iH-((v-mn)/rng)*iH; };
  const path = pts.map(function(v,i){ return (i===0?"M":"L")+x(i).toFixed(1)+","+y(v).toFixed(1); }).join(" ");
  const fill = path+" L"+x(pts.length-1).toFixed(1)+","+(P+iH).toFixed(1)+" L"+P+","+(P+iH).toFixed(1)+" Z";
  const last=pts[pts.length-1], lc=last>=0?C.green:C.red, showZ=mn<0&&mx>0;
  let pk2=0,maxDD2=0;
  pts.forEach(function(v){if(v>pk2)pk2=v;const dd=pk2-v;if(dd>maxDD2)maxDD2=dd;});
  return (
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"16px 20px",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <span style={{fontSize:10,color:C.sub,letterSpacing:"0.14em",textTransform:"uppercase"}}>{"Equity Curve \u00B7 1R = $"+rv}</span>
        <div style={{display:"flex",gap:24}}>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:9,color:C.sub,marginBottom:2}}>Total R</div>
            <div style={{fontSize:16,fontWeight:700,color:lc}}>{fmtR(last)}</div>
            <div style={{fontSize:11,color:lc,opacity:0.65}}>{fmtD(last*rv)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:9,color:C.sub,marginBottom:2}}>Max DD</div>
            <div style={{fontSize:16,fontWeight:700,color:C.red}}>{"-"+maxDD2.toFixed(2)+"R"}</div>
            <div style={{fontSize:11,color:C.red,opacity:0.65}}>{"$"+Math.round(maxDD2*rv).toLocaleString()}</div>
          </div>
        </div>
      </div>
      <svg viewBox={"0 0 "+W+" "+H} width="100%" style={{display:"block"}}>
        <line x1={P} y1={P+iH*0.33} x2={W-P} y2={P+iH*0.33} stroke="#14141A" strokeWidth="1"/>
        <line x1={P} y1={P+iH*0.67} x2={W-P} y2={P+iH*0.67} stroke="#14141A" strokeWidth="1"/>
        {showZ && <line x1={P} y1={y(0)} x2={W-P} y2={y(0)} stroke="#2A2A34" strokeWidth="0.75" strokeDasharray="4,3"/>}
        <path d={fill} fill={lc+"18"}/>
        <path d={path} fill="none" stroke={lc} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        {pts.map(function(v,i){ return <circle key={i} cx={x(i)} cy={y(v)} r="2" fill={i===0?"#444":v>=(pts[Math.max(0,i-1)]||0)?C.green:C.red}/>; })}
        <text x={P-4} y={P+4}    fill={C.sub} fontSize="8" textAnchor="end">{mx.toFixed(1)+"R"}</text>
        <text x={P-4} y={P+iH+4} fill={C.sub} fontSize="8" textAnchor="end">{mn.toFixed(1)+"R"}</text>
      </svg>
    </div>
  );
}

// ─── DAY CELL ─────────────────────────────────────────────────────────────────
function DayCell({info, stats, rv, today, showOnlyR}) {
  const r    = stats ? calcR(stats.totalPnl, rv) : null;
  const bg   = stats ? dayBg(r) : "transparent";
  const inM  = info.inMonth;
  const isToday = info.dateStr === today;
  const textC = !inM ? C.muted : r == null ? C.sub : r > 0 ? C.green : r < 0 ? C.red : C.sub;
  return (
    <div style={{background:inM?(bg||C.card):C.dim,border:"1px solid "+(isToday?C.gold+"70":C.border),borderRadius:6,padding:"8px 10px",minHeight:72,opacity:inM?1:0.3}}>
      <div style={{fontSize:11,color:isToday?C.gold:C.sub,fontWeight:isToday?700:400,marginBottom:5}}>{info.day}</div>
      {stats && inM && (
        <div>
          <div style={{fontSize:14,fontWeight:700,color:textC,lineHeight:1,marginBottom:3}}>{fmtR(r)}</div>
          {!showOnlyR && <div style={{fontSize:10,color:textC,opacity:0.7,marginBottom:3}}>{fmtD(stats.totalPnl)}</div>}
          <div style={{fontSize:9,color:C.sub}}>{stats.n+"t \u00B7 "+stats.wr.toFixed(0)+"%W"}</div>
        </div>
      )}
    </div>
  );
}

// ─── WEEK CELL ────────────────────────────────────────────────────────────────
function WeekCell({weekTrades, rv, showOnlyR}) {
  if (!weekTrades || !weekTrades.length) return (
    <div style={{background:C.dim,border:"1px solid "+C.border,borderRadius:6,padding:"8px 10px",minHeight:72,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <span style={{fontSize:9,color:C.muted}}>{"\u2014"}</span>
    </div>
  );
  const closed   = weekTrades.filter(function(t){ return t.result !== "Open"; });
  const totalPnl = closed.reduce(function(s,t){ return s+(t.pnl_dollars||0); }, 0);
  const r   = calcR(totalPnl, rv);
  const wins = closed.filter(function(t){ return t.result === "Win"; }).length;
  const wr  = closed.length ? wins / closed.length * 100 : 0;
  const col = r > 0 ? C.green : r < 0 ? C.red : C.sub;
  return (
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:6,padding:"8px 10px",minHeight:72}}>
      <div style={{fontSize:9,color:C.sub,marginBottom:5,letterSpacing:"0.08em"}}>TOT</div>
      <div style={{fontSize:13,fontWeight:700,color:col,lineHeight:1,marginBottom:2}}>{fmtR(r)}</div>
      {!showOnlyR && <div style={{fontSize:10,color:col,opacity:0.7,marginBottom:2}}>{fmtD(totalPnl)}</div>}
      <div style={{fontSize:9,color:C.sub}}>{closed.length+"t \u00B7 "+wr.toFixed(0)+"%W"}</div>
    </div>
  );
}

// ─── CALENDARIO VIEW ──────────────────────────────────────────────────────────
function CalendarioView({trades, rv, onImport, onExport, onTWImport, ohlcMeta, showOnlyR, onToggleR}) {
  const now = new Date();
  const [year,  setYear]  = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const today = now.toISOString().slice(0, 10);
  const byDate = {};
  trades.forEach(function(t){ if (!byDate[t.date]) byDate[t.date]=[]; byDate[t.date].push(t); });
  function dayStats(ds) {
    const dt = byDate[ds]; if (!dt || !dt.length) return null;
    const closed = dt.filter(function(t){ return t.result !== "Open"; }); if (!closed.length) return null;
    const totalPnl = closed.reduce(function(s,t){ return s+(t.pnl_dollars||0); }, 0);
    const wins = closed.filter(function(t){ return t.result === "Win"; }).length;
    return { n: closed.length, totalPnl: totalPnl, wr: wins / closed.length * 100 };
  }
  const weeks = getCalendarWeeks(year, month);
  const monthTrades = trades.filter(function(t){
    const p = t.date.split("-").map(Number); return p[0]===year && p[1]-1===month;
  });
  const ms = calcStats(monthTrades, rv);
  function prevM(){ if (month===0){setYear(function(y){return y-1;}); setMonth(11);} else setMonth(function(m){return m-1;}); }
  function nextM(){ if (month===11){setYear(function(y){return y+1;}); setMonth(0);} else setMonth(function(m){return m+1;}); }
  const monthSummary = [
    {label:"WIN RATE", val:ms?ms.wr.toFixed(0)+"%":"", col:ms?(ms.wr>=50?C.green:C.red):C.sub},
    {label:"TRADE",    val:ms?String(ms.n):"",          col:C.text},
    {label:"W/L/BE",   val:ms?(ms.w+" / "+ms.l+" / "+ms.be):"", col:C.sub},
  ];
  return (
    <div>
      <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"18px 20px",marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:ms?16:0}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <button onClick={prevM} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:15,padding:"4px 12px",cursor:"pointer",fontFamily:"inherit"}}>{"\u2039"}</button>
            <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:700,color:C.text,letterSpacing:"0.08em"}}>{MONTHS_IT[month].toUpperCase()+" "+year}</span>
            <button onClick={nextM} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:15,padding:"4px 12px",cursor:"pointer",fontFamily:"inherit"}}>{"\u203A"}</button>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <button onClick={onToggleR} style={{padding:"6px 12px",background:showOnlyR?C.gold+"20":"transparent",border:"1px solid "+(showOnlyR?C.gold:C.border),borderRadius:20,color:showOnlyR?C.gold:C.sub,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",fontWeight:showOnlyR?700:400}}>
              {showOnlyR?"R":"R \u00B7 $"}
            </button>
            {ohlcMeta && <span style={{fontSize:10,color:C.green,border:"1px solid "+C.green+"30",borderRadius:4,padding:"3px 8px"}}>{"OHLC "+ohlcMeta.days+"gg"}</span>}
            <button onClick={onTWImport} style={{padding:"7px 14px",background:"transparent",border:"1px solid "+C.blue+"50",borderRadius:4,color:C.blue,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase"}}>{"TW \u2191"}</button>
            <button onClick={onImport}   style={{padding:"7px 14px",background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase"}}>{"IMPORT \u2191"}</button>
            <button onClick={onExport}   style={{padding:"7px 14px",background:"transparent",border:"1px solid "+C.gold+"50",borderRadius:4,color:C.gold,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase"}}>{"EXPORT \u2193"}</button>
          </div>
        </div>
        {ms && (
          <div style={{display:"flex",gap:24,paddingTop:12,borderTop:"0.5px solid "+C.muted}}>
            <div>
              <div style={{fontSize:9,color:C.sub,marginBottom:2,letterSpacing:"0.1em"}}>MESE</div>
              <div style={{fontSize:18,fontWeight:700,color:ms.totalR>=0?C.green:C.red}}>{fmtR(ms.totalR)}</div>
              {!showOnlyR && <div style={{fontSize:11,color:ms.totalR>=0?C.green:C.red,opacity:0.65}}>{fmtD(ms.totalD)}</div>}
            </div>
            {monthSummary.map(function(item){ return (
              <div key={item.label} style={{borderLeft:"0.5px solid "+C.muted,paddingLeft:24}}>
                <div style={{fontSize:9,color:C.sub,marginBottom:2,letterSpacing:"0.1em"}}>{item.label}</div>
                <div style={{fontSize:16,fontWeight:600,color:item.col}}>{item.val}</div>
              </div>
            ); })}
          </div>
        )}
      </div>
      <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"16px"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr) 80px",gap:6,marginBottom:8}}>
          {DAYS_IT.map(function(d){ return <div key={d} style={{textAlign:"center",fontSize:10,color:C.sub,letterSpacing:"0.1em",padding:"3px 0"}}>{d}</div>; })}
          <div style={{textAlign:"center",fontSize:9,color:C.muted,letterSpacing:"0.08em",padding:"3px 0"}}>WEEK</div>
        </div>
        {weeks.map(function(week, wi){
          const wkTrades = [];
          for (let d = 0; d < week.length; d++) {
            if (week[d].inMonth) {
              const dt = byDate[week[d].dateStr];
              if (dt) for (let j = 0; j < dt.length; j++) wkTrades.push(dt[j]);
            }
          }
          return (
            <div key={wi} style={{display:"grid",gridTemplateColumns:"repeat(5,1fr) 80px",gap:6,marginBottom:6}}>
              {week.map(function(info, di){ return <DayCell key={di} info={info} stats={dayStats(info.dateStr)} rv={rv} today={today} showOnlyR={showOnlyR}/>; })}
              <WeekCell weekTrades={wkTrades} rv={rv} showOnlyR={showOnlyR}/>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── SETTIMANALE ──────────────────────────────────────────────────────────────
function SettimanaleView() {
  function getW(){
    const d=new Date(),y=d.getFullYear();
    const wn=Math.ceil(((d-new Date(y,0,1))/86400000+new Date(y,0,1).getDay()+1)/7);
    return y+"-W"+String(wn).padStart(2,"0");
  }
  const [week,  setWeek]  = useState(getW());
  const [data,  setData]  = useState({});
  const [flash, setFlash] = useState("");
  useEffect(function(){
    (async function(){
      try{ const r=await storage.get("jnl:v2:week:"+week); setData(r?JSON.parse(r.value):{}); }
      catch(e){ setData({}); }
    })();
  },[week]);
  async function save(){
    try{ await storage.set("jnl:v2:week:"+week,JSON.stringify(data)); setFlash("Salvato \u2713"); setTimeout(function(){setFlash("");},2000); }
    catch(e){}
  }
  const cinp = {background:C.muted,border:"1px solid "+C.border,borderRadius:3,padding:"3px 6px",fontSize:11,color:C.text,outline:"none",width:"100%",fontFamily:"inherit",boxSizing:"border-box"};
  const FIELDS = [

// ─── TW IMPORT MODAL ──────────────────────────────────────────────────────────
function TWImportModal({onClose, onSave, existing}) {
  const [parsed,  setParsed]  = useState(null);
  const [error,   setError]   = useState("");
  const [saving,  setSaving]  = useState(false);
  function handleFile(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = parseTWCsv(ev.target.result);
        if (!data.length){ setError("Nessuna candela valida."); return; }
        const times = data.map(function(c){return c.time;});
        const first = unixToETDate(Math.min.apply(null,times));
        const last  = unixToETDate(Math.max.apply(null,times));
        const daySet = {};
        data.forEach(function(c){ daySet[unixToETDate(c.time)]=1; });
        const days = Object.keys(daySet).length;
        setParsed({data:data,first:first,last:last,n:data.length,days:days}); setError("");
      } catch(err){ setError("Errore: "+err.message); }
    };
    reader.readAsText(file);
  }
  async function handleSave(){
    if (!parsed) return; setSaving(true);
    await onSave(parsed.data,{first:parsed.first,last:parsed.last,n:parsed.n,days:parsed.days});
    setSaving(false); onClose();

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>

        <div style={{border:"2px dashed "+C.border,borderRadius:8,padding:"28px 20px",textAlign:"center",marginBottom:14}}>

// ─── IMPORT MODAL (Tradovate) ─────────────────────────────────────────────────
function ImportModal({onClose, trades, setTrades}) {
  const [parsed,  setParsed]  = useState(null);
  const [error,   setError]   = useState("");
  const [saving,  setSaving]  = useState(false);
  function handleFile(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const res = parseTradovateCSV(ev.target.result);
      if (res.errors.length && !res.trades.length){ setError(res.errors.join(" | ")); setParsed(null); return; }
      setParsed(res); setError("");
    };
    reader.readAsText(file);
  }
  async function handleImport(){
    if (!parsed || !parsed.trades.length) return;
    setSaving(true);
    const existingIds = {};
    trades.forEach(function(t){ existingIds[t.id]=1; });
    const newTrades = [...trades];
    parsed.trades.forEach(function(t){ if (!existingIds[t.id]) newTrades.push(t); });
    setTrades(newTrades);
    try{ await storage.set("jnl:v2:trades",JSON.stringify(newTrades)); }catch(e){}
    setSaving(false); onClose();
  }
  const winsN   = parsed ? parsed.trades.filter(function(t){return t.result==="Win";}).length  : 0;
  const lossesN = parsed ? parsed.trades.filter(function(t){return t.result==="Loss";}).length : 0;
  const besN    = parsed ? parsed.trades.filter(function(t){return t.result==="BE";}).length   : 0;
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:12,padding:24,width:"100%",maxWidth:580}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18}}>
          <div>
            <div style={{fontSize:13,color:C.text,fontWeight:600,letterSpacing:"0.08em"}}>IMPORT — TRADOVATE</div>

          </div>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:C.sub,fontSize:22,cursor:"pointer",lineHeight:1}}>{"\u00D7"}</button>
        </div>
        <div style={{border:"2px dashed "+C.border,borderRadius:8,padding:"24px 20px",textAlign:"center",marginBottom:14}}>
          {!parsed ? (
            <div>
              <div style={{fontSize:13,color:C.sub,marginBottom:4}}>Seleziona il file Position_History.csv</div>
              <div style={{fontSize:10,color:C.muted,marginBottom:18}}>Usa Position History, NON Orders</div>
              <label style={{display:"inline-block",padding:"9px 22px",border:"1px solid "+C.gold,borderRadius:4,color:C.gold,fontSize:12,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em"}}>
                SELEZIONA FILE CSV
                <input type="file" accept=".csv" onChange={handleFile} style={{display:"none"}}/>
              </label>
            </div>
          ) : (
            <div>
              <div style={{fontSize:14,color:C.green,fontWeight:700,marginBottom:8}}>{parsed.trades.length+" trade rilevati"}</div>
              <div style={{display:"flex",justifyContent:"center",gap:16,marginBottom:8}}>
                {winsN>0   && <span style={{fontSize:12,color:C.green,fontWeight:600}}>{"Win: "+winsN}</span>}
                {lossesN>0 && <span style={{fontSize:12,color:C.red,  fontWeight:600}}>{"Loss: "+lossesN}</span>}
                {besN>0    && <span style={{fontSize:12,color:C.sub,  fontWeight:600}}>{"BE: "+besN}</span>}
              </div>
              {parsed.errors.length>0 && <div style={{fontSize:10,color:C.gold,marginBottom:8}}>{parsed.errors.length+" righe ignorate"}</div>}
              <label style={{display:"inline-block",padding:"6px 16px",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:10,fontFamily:"inherit",cursor:"pointer",marginTop:4}}>

        <div style={{padding:"10px 14px",background:C.gold+"08",border:"1px solid "+C.gold+"25",borderRadius:6,marginBottom:16}}>
          <div style={{fontSize:10,color:C.gold,fontWeight:600,marginBottom:3}}>Note</div>
          <div style={{fontSize:10,color:C.sub,lineHeight:1.6}}>Orari convertiti da IT a ET automaticamente. P/L lordo (senza commissioni). Trade duplicati ignorati.</div>

        <div style={{display:"flex",gap:10}}>
          <button onClick={handleImport} disabled={!parsed||saving||!parsed.trades.length}

// ─── EXPORT MODAL ─────────────────────────────────────────────────────────────
function ExportModal({trades, rv, onClose}) {
  const headers = ["date","entry_time","exit_time","duration","direction","entry_price","exit_price","pnl_dollars","r","result","product","partial","notes"];
  const rows = [...trades].reverse().map(function(t){
    return headers.map(function(h){
      if (h==="r")       return '"'+calcR(t.pnl_dollars||0,rv).toFixed(2)+'"';
      if (h==="partial") return '"'+( t.partial?"Si":"No")+'"';
      return '"'+String(t[h]||"").replace(/"/g,'\'\'')+'"';
    }).join(",");
  });
  const csv = [headers.join(","), ...rows].join("\n");
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.90)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:12,padding:24,width:"100%",maxWidth:680}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <span style={{fontSize:13,color:C.text,fontWeight:600,letterSpacing:"0.08em"}}>EXPORT CSV</span>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:C.sub,fontSize:22,cursor:"pointer",lineHeight:1}}>{"\u00D7"}</button>
        </div>
        <textarea readOnly value={csv} rows={10} onFocus={function(e){e.target.select();}} style={{width:"100%",background:C.card,border:"1px solid "+C.border,borderRadius:6,color:C.sub,fontSize:10,padding:"12px",fontFamily:"'IBM Plex Mono',monospace",outline:"none",resize:"none",boxSizing:"border-box"}}/>
        <div style={{display:"flex",gap:10,marginTop:12}}>
          <button onClick={function(){navigator.clipboard.writeText(csv);}} style={{padding:"8px 20px",background:"transparent",border:"1px solid "+C.gold,borderRadius:4,color:C.gold,fontSize:11,fontFamily:"inherit",cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase"}}>COPIA TUTTO</button>

        </div>
      </div>
    </div>
  );
}

function Journal() {

    return DOW_IT[d.getDay()]+" "+d.toLocaleDateString("it-IT")+" "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  }
  useEffect(function(){
    setTime(getTime());
    const t=setInterval(function(){setTime(getTime());},30000);
    return function(){clearInterval(t);};
  },[]);
  useEffect(function(){
    (async function(){
      try{
        const tr=await storage.get("jnl:v2:trades");
        const st=await storage.get("jnl:v2:settings");
        const oh=await storage.get("jnl:v2:ohlc");
        const om=await storage.get("jnl:v2:ohlcmeta");
        if(tr) setTrades(JSON.parse(tr.value));
        else{ setTrades(SEED); await storage.set("jnl:v2:trades",JSON.stringify(SEED)); }
        if(st){ const s=JSON.parse(st.value); if(s.rv) setRv(s.rv); }
        if(oh){ const arr=JSON.parse(oh.value); setOhlcData(arr.map(function(c){return{time:c[0],high:c[1],low:c[2]};})); }
        if(om) setOhlcMeta(JSON.parse(om.value));
      }catch(e){}
      setLoading(false);
    })();
  },[]);

    setRv(newR);
    try{ await storage.set("jnl:v2:settings",JSON.stringify({rv:newR})); }catch(e){}
    setShowSettings(false);
  }

    setOhlcData(data); setOhlcMeta(meta);

      const compact=data.map(function(c){return[c.time,c.high,c.low];});
      await storage.set("jnl:v2:ohlc",JSON.stringify(compact));

            {"Hello "}<span style={{color:C.gold}}>Noemi</span>

        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
          <span style={{fontSize:11,color:C.sub}}>{time}</span>
          <button onClick={function(){setShowSettings(true);}} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:C.sub,fontSize:10,padding:"5px 14px",cursor:"pointer",fontFamily:"inherit",letterSpacing:"0.1em",textTransform:"uppercase"}}>
            {"\u2699 settings"}
          </button>
        </div>
      </div>
      <div style={{display:"flex",borderBottom:"1px solid "+C.border,marginBottom:22,gap:2}}>
        {TABS.map(function(t){
          return (
            <button key={t.k} onClick={function(){setTab(t.k);}} style={{padding:"10px 26px",fontSize:13,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,letterSpacing:"0.14em",cursor:"pointer",background:"transparent",border:"none",borderBottom:"2px solid "+(tab===t.k?C.gold:C.border),color:tab===t.k?C.gold:C.sub,transition:"all 0.15s"}}>
              {t.l}
            </button>
          );
        })}
      </div>
      {tab==="dashboard"   && <Dashboard      trades={trades} rv={rv} ohlcData={ohlcData}/>}
      {tab==="calendario"  && <CalendarioView  trades={trades} rv={rv} onImport={function(){setShowImport(true);}} onExport={function(){setShowExport(true);}} onTWImport={function(){setShowTWImport(true);}} ohlcMeta={ohlcMeta} showOnlyR={showOnlyR} onToggleR={toggleR}/>}
      {tab==="settimanale" && <SettimanaleView/>}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(Journal));
  </script>
</body>
</html>
